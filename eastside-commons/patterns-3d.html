<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EC Pattern Solver — 3D View</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f08; --surface: #131a0f; --border: #22301a;
    --text: #e0d8c0; --muted: #6a6050; --accent: #c87818;
    --amber: #c87818; --teal: #28a888; --green: #28b848;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    --font: system-ui, -apple-system, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  body { display: flex; flex-direction: column; }

  #header {
    display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
    padding: 0.45rem 1rem; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #header h1 { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; white-space: nowrap; }
  .ctrl-group { display: flex; align-items: center; gap: 0.35rem; }
  .ctrl-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
  .ctrl-val { font-size: 0.62rem; font-family: var(--font-mono); color: var(--amber); min-width: 2rem; text-align: right; }
  input[type=range] { accent-color: var(--amber); width: 70px; cursor: pointer; }
  select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 0.62rem; padding: 0.18rem 0.35rem; font-family: var(--font-mono); cursor: pointer; border-radius: 2px; }
  #btn-run { background: var(--amber); color: #0b0f08; border: none; padding: 0.28rem 0.8rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 2px; flex-shrink: 0; }
  #btn-run:disabled { opacity: 0.4; cursor: default; }
  #btn-run:hover:not(:disabled) { background: #e8a030; }
  #status { font-size: 0.58rem; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }

  .toggle-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 0.2rem 0.5rem; font-size: 0.58rem; cursor: pointer; border-radius: 2px; font-family: var(--font-mono); }
  .toggle-btn.on { border-color: var(--amber); color: var(--amber); background: rgba(200,120,24,0.1); }

  #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  #three-canvas { width: 100%; height: 100%; display: block; }

  #canvas-label { position: absolute; bottom: 0.5rem; left: 0.7rem; font-size: 0.52rem; color: var(--muted); font-family: var(--font-mono); pointer-events: none; letter-spacing: 0.06em; }
  #legend { position: absolute; bottom: 0.5rem; right: 0.7rem; font-size: 0.52rem; color: var(--muted); font-family: var(--font-mono); pointer-events: none; line-height: 1.6; text-align: right; }
  #err-banner { display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#8b0000;color:#fff;font-family:monospace;font-size:0.7rem;padding:0.5rem 1rem;white-space:pre-wrap;max-height:30vh;overflow-y:auto; }
</style>
</head>
<body>

<div id="header">
  <a href="index.html" style="font-size:0.58rem;color:var(--muted);text-decoration:none;letter-spacing:0.08em;white-space:nowrap" title="Back to site plan">← Site Plan</a>
  <h1>EC · Pattern Solver · 3D</h1>

  <div class="ctrl-group">
    <span class="ctrl-label">Passes</span>
    <input type="range" id="ctrl-passes" min="4" max="24" value="16" step="1">
    <span class="ctrl-val" id="val-passes">16</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">ε</span>
    <input type="range" id="ctrl-eps" min="0.001" max="0.05" value="0.008" step="0.001">
    <span class="ctrl-val" id="val-eps">0.008</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Res ft</span>
    <input type="range" id="ctrl-res" min="5" max="100" value="10" step="5">
    <span class="ctrl-val" id="val-res">10</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Thresh</span>
    <input type="range" id="ctrl-thresh" min="0.05" max="0.6" value="0.2" step="0.05">
    <span class="ctrl-val" id="val-thresh">0.20</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Ht scale</span>
    <input type="range" id="ctrl-htscale" min="0.5" max="8" value="2.5" step="0.25">
    <span class="ctrl-val" id="val-htscale">2.5×</span>
  </div>

  <button class="toggle-btn on" id="tog-buildings">Bldgs</button>
  <button class="toggle-btn on" id="tog-lines">Lines</button>
  <button class="toggle-btn on" id="tog-nodes">Nodes</button>
  <button class="toggle-btn on" id="tog-ground">Ground</button>
  <button class="toggle-btn on" id="tog-detail">Detail</button>
  <button class="toggle-btn on" id="tog-trees">Trees</button>

  <button id="btn-run">▶ Solve</button>
  <span id="status">—</span>
</div>

<div id="canvas-wrap">
  <div id="err-banner"></div>
  <canvas id="three-canvas"></canvas>
  <div id="canvas-label">Military Circle · 73.4 ac · Norfolk VA · 3D field model · ft</div>
  <div id="legend">drag to orbit · scroll to zoom · shift+drag to pan</div>
</div>

// ── GLOBAL ERROR DISPLAY ─────────────────────────────────────────────────────
(function() {
  function showErr(msg, src, line) {
    const b = document.getElementById('err-banner');
    if (!b) return;
    b.style.display = 'block';
    b.textContent = (b.textContent ? b.textContent + '\n' : '') +
      '⚠ ' + msg + (src ? ' @ ' + src.split('/').pop() + ':' + line : '');
    const st = document.getElementById('status');
    if (st) st.textContent = '⚠ Error — see red banner';
  }
  window.onerror = (msg, src, line, col, err) => {
    showErr((err && err.message) || msg, src, line);
    return false;
  };
  window.onunhandledrejection = (e) => {
    showErr((e.reason && e.reason.message) || String(e.reason), '', '');
  };
  window._showErr = showErr;
})();

// ── PROJECTION + GIS ─────────────────────────────────────────────────────────
function buildProjection(parcels) {
  // Project to feet from site south-west corner.
  // 1° lat ≈ 111320m; 1° lon ≈ cos(lat)*111320m.
  // Y axis: north = +y (we flip for SVG later).
  const edaParcels = parcels.filter(p => p.is_eda);
  let minLon=Infinity, maxLon=-Infinity, minLat=Infinity, maxLat=-Infinity;
  for (const p of edaParcels) {
    for (const ring of p.rings) {
      for (const [lon,lat] of ring) {
        if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
        if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
      }
    }
  }
  const latRad = (minLat+maxLat)/2 * Math.PI/180;
  const M_PER_DEG_LON = Math.cos(latRad)*111320;
  const M_PER_DEG_LAT = 111320;
  const FT_PER_M = 3.28084;

  // Site bounds in feet (south-west origin, north = +y)
  const siteWft = (maxLon-minLon)*M_PER_DEG_LON*FT_PER_M;
  const siteHft = (maxLat-minLat)*M_PER_DEG_LAT*FT_PER_M;

  // Pad 12% each side so EDA isn't clipped
  const padX = siteWft*0.12, padY = siteHft*0.12;

  // Field-space MAP in feet (origin = SW corner of padded bbox)
  const MAP = {
    x0: -padX,       y0: -padY,
    x1: siteWft+padX, y1: siteHft+padY,
    // Convenience
    siteWft, siteHft,
    // SVG viewport (unchanged — only used for rendering)
    svgX0:139, svgY0:163, svgX1:841, svgY1:653,
  };

  // proj(lon, lat) → [ft_x, ft_y]  (north = +y, south-west origin)
  function proj(lon, lat) {
    const fx = (lon - minLon) * M_PER_DEG_LON * FT_PER_M;
    const fy = (lat - minLat) * M_PER_DEG_LAT * FT_PER_M;
    return [fx, fy];
  }

  // ftToSvg(fx, fy) → [svgX, svgY]  (flip y for SVG)
  const svgW = MAP.svgX1-MAP.svgX0, svgH = MAP.svgY1-MAP.svgY0;
  const ftW  = MAP.x1-MAP.x0,       ftH  = MAP.y1-MAP.y0;
  function ftToSvg(fx, fy) {
    return [
      MAP.svgX0 + (fx-MAP.x0)/ftW * svgW,
      MAP.svgY1 - (fy-MAP.y0)/ftH * svgH,   // flip: north (+fy) → top (−svgY)
    ];
  }

  return {proj, MAP, ftToSvg};
}

function buildParcelGeometry(parcels,proj) {
  const geom={};
  for (const p of parcels) {
    if (!p.spec) continue;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,cx=0,cy=0,n=0;
    for (const ring of (p.rings||[])) {
      for (const pt of ring) {
        const [x,y]=proj(pt[0]??pt.lon, pt[1]??pt.lat);
        if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
        cx+=x;cy+=y;n++;
      }
    }
    if(n===0)continue;
    // In feet (north=+y): top=north=maxY, bottom=south=minY
    geom[p.spec]={centroid_x:cx/n,centroid_y:cy/n,
      bbox:{left:minX,right:maxX,top:maxY,bottom:minY,width:maxX-minX,height:maxY-minY}};
  }
  return geom;
}

function solveConstraintsMin(G, MAP) {
  // All values in feet. Parcel geometry (G) is already in feet from buildParcelGeometry.
  const derived = {};
  const MALL=G['MALL_CORE'], SP_PAR=G['SPONGE_PARCEL'], HB_PAR=G['HOUSING_B_S'];
  if (!MALL) return {derived};

  // Commons Spine: 18% of MALL width, min 120ft wide, full N-S site height
  // Feet coordinate system: north = +y, south = -y (SW origin).
  // bbox.top = northernmost (max y), bbox.bottom = southernmost (min y).
  // SPINE runs full N-S (MAP.y0 to MAP.y1).
  const spine_w = Math.max(MALL.bbox.width*0.18, 120);
  const spine_x = MALL.centroid_x - spine_w/2;
  derived.SPINE = {x:spine_x, y:MAP.y0, w:spine_w, h:MAP.y1-MAP.y0};
  const sl=spine_x, sr=spine_x+spine_w, scx=spine_x+spine_w/2;

  // Main Street Band: southern edge of site (low y) up to south edge of MS parcels.
  // MS parcels are at the south of the site (small y values in ft).
  // Band = zone from MAP.y0 (south boundary) northward to MS north edge.
  const compactMS=['MAIN_ST_LARGE','MAIN_ST_MID','MAIN_ST_5773','MAIN_ST_5825'];
  // top = northernmost edge of MS parcels (the edge closest to the interior)
  const msBotRaw=Math.max(...compactMS.filter(n=>G[n]).map(n=>G[n].bbox.top));
  const bandTop=Math.min(msBotRaw+20, MALL.bbox.bottom+15);
  derived.BAND={x:MAP.x0, y:MAP.y0, w:MAP.x1-MAP.x0, h:bandTop-MAP.y0};
  const bby=MAP.y0+derived.BAND.h;  // north edge of band in ft

  // Sponge Park: east of spine, between band north edge and housing south edge
  const sg_avail_left=sr+30, sg_avail_right=MAP.x1-300;
  const sg_avail_south=bby+25;
  const sg_avail_north=HB_PAR ? HB_PAR.bbox.bottom-20 : MAP.y1-300;
  const sg_rx=Math.min((sg_avail_right-sg_avail_left)/2, 300);
  const sg_ry=Math.min((sg_avail_north-sg_avail_south)/2, 230);
  let sg_cx=sg_avail_left+sg_rx, sg_cy=(sg_avail_south+sg_avail_north)/2;
  if(SP_PAR){
    const dist=Math.abs(SP_PAR.centroid_x-sg_cx);
    if(dist<sg_rx*1.5) sg_cx=(sg_cx+SP_PAR.centroid_x)/2;
    sg_cy=(sg_cy+SP_PAR.centroid_y)/2;
  }
  derived.SPONGE={cx:sg_cx, cy:sg_cy, rx:Math.max(sg_rx,50), ry:Math.max(sg_ry,50)};
  derived.BASIN ={cx:sg_cx, cy:sg_cy, rx:Math.max(sg_rx,50)*0.38, ry:Math.max(sg_ry,50)*0.38};

  // Research Station: ~300×150ft east of sponge
  const res_w=300, res_h=150;
  const res_x=Math.min(sg_cx+sg_rx+30, MAP.x1-res_w-15);
  derived.RESEARCH={x:res_x, y:sg_cy-res_h/2, w:res_w, h:res_h};

  // Ross Leasehold: ~330×200ft east of spine
  const ross_w=330, ross_h=200;
  const ross_x=Math.max(Math.min(sr+25, MALL.bbox.right-ross_w-15), sr+20);
  derived.ROSS={x:ross_x, y:bby+20, w:ross_w, h:ross_h};

  // TIDE station: ~200ft deep at south end of spine (small y = south)
  const tide_h=200;
  derived.TIDE={x:sl, y:MAP.y0, w:spine_w, h:tide_h};
  derived.BIKE={y:bby+15, x0:MAP.x0, x0end:sl-8, x1start:sr+8, x1end:MAP.x1};

  return {derived};
}

// ── FIELD SOLVER ─────────────────────────────────────────────────────────────
window.EC_FieldSolver = (() => {

  // Pattern color palette — each pattern gets a unique hue
  const PATTERN_COLORS = {
    29: '#c87818', // DensityRings    — amber
    30: '#e84040', // ActivityNodes   — red
    31: '#c87818', // Promenade       — amber (spine-related)
    36: '#a060e0', // DegreesPublic   — purple
    37: '#40a860', // HouseCluster    — green
    46: '#e0a020', // Market          — gold
    51: '#28c060', // GreenStreets    — bright green
    53: '#e06020', // Gateways        — orange
    60: '#30b870', // AccessibleGreen — teal-green
    61: '#80d080', // SmallSquares    — light green
    67: '#20a850', // CommonLand      — forest green
    71: '#2890d0', // StillWater      — blue
    87: '#e0c020', // Shops           — yellow
    88: '#d09030', // Cafe            — amber-warm
    95: '#a04030', // BuildingComplex — brick
    100:'#40b0c0', // PedStreet       — cyan
    109:'#906030', // LongThinHouse   — brown
    116:'#c06080', // CascadeRoofs    — rose
    46: '#e8b020', // Market          — gold
    104:'#806040', // SiteRepair      — earth
    105:'#d08820', // SouthFacing     — ochre
    106:'#50c0a0', // PositiveOutdoor — turquoise
    109:'#a06838', // LongThinHouse   — terracotta
    114:'#7090c0', // HierarchyOpen   — steel blue
    115:'#30a870', // CourtyardsLive  — jade
    122:'#e06040', // BuildingFronts  — coral
    127:'#9060b0', // IntimacyGrad    — violet
  };

  // Pattern metadata for sense functions
  const PATTERNS = {};

  function defPattern(id, name, weight, senseFn) {
    PATTERNS[id] = { id, name, weight, sense: senseFn,
      color: PATTERN_COLORS[id] || '#888888' };
  }

  // ── FIELD PRIMITIVES ──────────────────────────────────────────────────────
  // A Field is a flat Float32Array over the MAP grid.
  // Coordinates: cell (cx, cy) → site (MAP.x0 + cx*cellSize, MAP.y0 + cy*cellSize)

  function makeField(gw, gh) {
    return new Float32Array(gw * gh);
  }

  // Add a gaussian blob of pressure at (sx,sy) with radius r and amplitude a
  function paintGaussian(field, gw, gh, cellSize, MAP, sx, sy, r, a) {
    const r2 = r * r;
    const cx0 = Math.max(0, Math.floor((sx - r - MAP.x0) / cellSize));
    const cx1 = Math.min(gw-1, Math.ceil((sx + r - MAP.x0) / cellSize));
    const cy0 = Math.max(0, Math.floor((sy - r - MAP.y0) / cellSize));
    const cy1 = Math.min(gh-1, Math.ceil((sy + r - MAP.y0) / cellSize));
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const px = MAP.x0 + cx*cellSize, py = MAP.y0 + cy*cellSize;
        const d2 = (px-sx)**2 + (py-sy)**2;
        if (d2 < r2) field[cy*gw+cx] += a * Math.exp(-3*d2/r2);
      }
    }
  }

  // Add pressure along a line segment (sx0,sy0)→(sx1,sy1) with width w
  function paintSegment(field, gw, gh, cellSize, MAP, sx0, sy0, sx1, sy1, w, a) {
    const steps = Math.ceil(Math.hypot(sx1-sx0, sy1-sy0) / (cellSize*0.5));
    for (let i = 0; i <= steps; i++) {
      const t = i/steps;
      paintGaussian(field, gw, gh, cellSize, MAP,
        sx0+(sx1-sx0)*t, sy0+(sy1-sy0)*t, w, a/steps);
    }
  }

  // Add pressure inside an ellipse
  function paintEllipse(field, gw, gh, cellSize, MAP, ecx, ecy, erx, ery, a) {
    const cx0 = Math.max(0, Math.floor((ecx-erx-MAP.x0)/cellSize));
    const cx1 = Math.min(gw-1, Math.ceil((ecx+erx-MAP.x0)/cellSize));
    const cy0 = Math.max(0, Math.floor((ecy-ery-MAP.y0)/cellSize));
    const cy1 = Math.min(gh-1, Math.ceil((ecy+ery-MAP.y0)/cellSize));
    for (let cy=cy0; cy<=cy1; cy++) {
      for (let cx=cx0; cx<=cx1; cx++) {
        const px=MAP.x0+cx*cellSize, py=MAP.y0+cy*cellSize;
        const nx=(px-ecx)/erx, ny=(py-ecy)/ery;
        const d2=nx*nx+ny*ny;
        if(d2<1) field[cy*gw+cx] += a * (1-d2);
      }
    }
  }

  // Normalize a field to [0,1]
  function normalizeField(field) {
    let mx=0;
    for (let i=0;i<field.length;i++) if(field[i]>mx) mx=field[i];
    if (mx>0) for (let i=0;i<field.length;i++) field[i]/=mx;
  }

  // Combine fields into a weighted sum
  function combineFields(fieldMap, gw, gh) {
    const combined = new Float32Array(gw*gh);
    for (const {field, weight} of Object.values(fieldMap)) {
      for (let i=0;i<combined.length;i++) combined[i] += field[i]*weight;
    }
    return combined;
  }

  // ── EDA MASK ──────────────────────────────────────────────────────────────
  let _edaMask = null;

  function buildEdaMask(parcels, proj, gw, gh, cellSize, MAP) {
    _edaMask = new Uint8Array(gw*gh);
    // Build projected EDA polygons
    const edaPolys = parcels
      .filter(p=>p.is_eda && p.rings?.[0])
      .map(p=>p.rings[0].map(([lon,lat])=>{const r=proj(lon,lat);return Array.isArray(r)?r:[r.x,r.y];}));
    function pip(px, py, poly) {
      let inside=false;
      for (let i=0,j=poly.length-1;i<poly.length;j=i++) {
        const [xi,yi]=poly[i],[xj,yj]=poly[j];
        if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;

    for (let cy=0;cy<gh;cy++) {
      for (let cx=0;cx<gw;cx++) {
        const px=MAP.x0+cx*cellSize, py=MAP.y0+cy*cellSize;
        if (edaPolys.some(poly=>pip(px,py,poly))) _edaMask[cy*gw+cx]=1;
      }
    }
  }

  function inEDA(cx, cy, gw, gh) {
    if (!_edaMask) return true;
    if (cx<0||cy<0||cx>=gw||cy>=gh) return false;

  defPattern(127, 'Intimacy Gradient', 0.65, (field,gw,gh,cs,MAP,site)=>{

  // ── FIELD LINE TRACER ─────────────────────────────────────────────────────
  // Trace splines along ridges of the combined field.
  // A field line follows the path where combined pressure stays above threshold.
  // At each point, it records which patterns contribute and at what weight.

  function findSeeds(combined, gw, gh, threshold, cellSize, MAP) {
    // Local maxima above threshold
    const seeds = [];
    for (let cy=1;cy<gh-1;cy++) {
      for (let cx=1;cx<gw-1;cx++) {
        const v=combined[cy*gw+cx];
        if (v<threshold) continue;
        // Is this a local max in any direction?
        const isMax = v >= combined[(cy-1)*gw+cx] && v >= combined[(cy+1)*gw+cx] &&
                      v >= combined[cy*gw+(cx-1)] && v >= combined[cy*gw+(cx+1)];
        if (isMax) seeds.push({cx,cy,v});
      }
    }
    // Sort by pressure descending, keep top seeds (deduplicated by proximity)
    seeds.sort((a,b)=>b.v-a.v);
    const kept=[], minSep=6; // cells
    for (const s of seeds) {
      if (kept.some(k=>Math.abs(k.cx-s.cx)<minSep&&Math.abs(k.cy-s.cy)<minSep)) continue;
      kept.push(s);
      if(kept.length>=80) break;
    }
    return kept;
  }

  function traceFieldLine(combined, gw, gh, startCx, startCy, cellSize, MAP, threshold) {
    // Bidirectional ridge tracer.
    // From the seed: trace in both directions along the local ridge.
    // "Ridge" = path that stays above threshold, preferring higher-valued neighbours
    // while also preferring to continue in the same direction (momentum).
    const maxSteps = Math.max(80, Math.round((gw+gh)*1.2));

    function traceDir(cx0, cy0, dirX, dirY, globalVisited) {
      const pts = [];
      let cx=cx0, cy=cy0, dx=dirX, dy=dirY;
      const localVisited = new Set();
      for (let step=0;step<maxSteps;step++) {
        const key=cy*gw+cx;
        if (globalVisited.has(key)||localVisited.has(key)) break;
        if (combined[key]<threshold*0.55) break;
        localVisited.add(key);
        pts.push({x:MAP.x0+cx*cellSize, y:MAP.y0+cy*cellSize, v:combined[key]});
        // Candidate neighbours: prefer direction momentum, then highest value
        const neighbours=[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1],[cx-1,cy-1],[cx+1,cy-1],[cx-1,cy+1],[cx+1,cy+1]];
        let best=null, bestScore=-Infinity;
        for (const [nx,ny] of neighbours) {
          if(nx<0||ny<0||nx>=gw||ny>=gh) continue;
          if(localVisited.has(ny*gw+nx)) continue;
          const nv=combined[ny*gw+nx];
          if(nv<threshold*0.45) continue;
          // Score: field value + momentum alignment bonus
          const ndx=nx-cx, ndy=ny-cy;
          const alignment = (dx*ndx+dy*ndy)/(Math.hypot(ndx,ndy)||1);
          const score = nv*0.7 + alignment*0.3;
          if(score>bestScore){bestScore=score;best=[nx,ny,ndx,ndy];}
        }
        if(!best) break;
        [cx,cy,dx,dy]=best;
      }
      return pts;
    }

    // Forward trace: start with (0,0) direction — will follow steepest gradient
    const globalVisited = new Set();
    const fwd = traceDir(startCx, startCy, 0, 0, globalVisited);
    // Mark forward path as visited
    for (const pt of fwd) {
      const cx=Math.round((pt.x-MAP.x0)/cellSize), cy=Math.round((pt.y-MAP.y0)/cellSize);
      globalVisited.add(cy*gw+cx);
    }
    // Backward trace: opposite initial direction of first forward step
    let bwd = [];
    if (fwd.length>=2) {
      const cx1=Math.round((fwd[0].x-MAP.x0)/cellSize), cy1=Math.round((fwd[0].y-MAP.y0)/cellSize);
      const cx2=Math.round((fwd[1].x-MAP.x0)/cellSize), cy2=Math.round((fwd[1].y-MAP.y0)/cellSize);
      const revDx=cx1-cx2, revDy=cy1-cy2;
      bwd = traceDir(startCx, startCy, revDx, revDy, globalVisited);
    }
    // Assemble: reversed bwd + fwd (excluding duplicated seed)
    return [...bwd.reverse(), ...fwd];
  }

  // For each point on a line, read per-pattern contributions
  function annotateFieldLine(pts, fieldMap, gw, gh, cellSize, MAP) {
    return pts.map(pt => {
      const cx = Math.round((pt.x-MAP.x0)/cellSize);
      const cy = Math.round((pt.y-MAP.y0)/cellSize);
      const idx = cy*gw+cx;
      const weights = {};
      let total = 0;
      for (const [pid, {field, weight}] of Object.entries(fieldMap)) {
        const w = (field[idx]||0)*weight;
        if (w>0.05) { weights[pid]=w; total+=w; }
      }
      return { ...pt, weights, total };
    });
  }

  // ── MAIN SOLVE ────────────────────────────────────────────────────────────
  // Runs until the combined field saturates (Δ < ε) or max passes is hit.
  // Saturation = patterns have squeezed as much simultaneous information
  // into the field as they can. This is the terminal condition.
  function solve(parcels, _proj, MAP, derivedG, opts={}) {
    // Normalize proj: accept both [x,y] and {x,y} return forms
    const proj = (lon,lat) => { const r=_proj(lon,lat); return Array.isArray(r)?r:[r.x,r.y]; };
    const MAX_PASSES  = opts.passes   || 16;
    const EPSILON     = opts.eps      || 0.008;
    const CELL_SIZE   = opts.cellSize || 10;  // feet per cell
    const ftToSvg     = opts.ftToSvg  || ((fx,fy)=>[fx,fy]); // fallback: identity
    const THRESHOLD   = opts.threshold|| 0.2;
    const log = [];

    const gw = Math.ceil((MAP.x1-MAP.x0)/CELL_SIZE)+1;
    const gh = Math.ceil((MAP.y1-MAP.y0)/CELL_SIZE)+1;

    log.push(`Grid: ${gw}×${gh} = ${gw*gh} cells @ ${CELL_SIZE}ft | ε=${EPSILON}`);

    buildEdaMask(parcels, proj, gw, gh, CELL_SIZE, MAP);

    const site = { derived: derivedG, fields: {}, combined: null };
    let allFieldLines = [];
    const snapshots = [];
    let prevCombined = null;
    let saturatedAt = null;

    for (let pass=0; pass<MAX_PASSES; pass++) {
      log.push(`Pass ${pass+1}/${MAX_PASSES}`);

      // Sense: each pattern fills its field
      const fieldMap = {};
      for (const [pid, pat] of Object.entries(PATTERNS)) {
        const field = makeField(gw, gh);
        try {
          pat.sense(field, gw, gh, CELL_SIZE, MAP, site, pass);
          // Mask to EDA
          for (let i=0;i<field.length;i++) {
            const cx=i%gw, cy=Math.floor(i/gw);
            if(!inEDA(cx,cy,gw,gh)) field[i]=0;
          }
          normalizeField(field);
          fieldMap[pid] = { field, weight: pat.weight };
        } catch(e) { log.push(`  P${pid} sense error: ${e.message}`); }
      }

      // Combine
      const combined = combineFields(fieldMap, gw, gh);
      normalizeField(combined);

      // Convergence check: mean absolute change vs previous pass
      if (prevCombined) {
        let delta = 0;
        for (let i=0;i<combined.length;i++) delta += Math.abs(combined[i]-prevCombined[i]);
        delta /= combined.length;
        log.push(`  Δ=${delta.toFixed(5)}`);
        if (delta < EPSILON && pass >= 2) {
          saturatedAt = pass+1;
          log.push(`  ✓ Saturated at pass ${saturatedAt} (Δ=${delta.toFixed(5)} < ε=${EPSILON})`);
          // Still trace lines for this final pass, then break
        }
      }
      prevCombined = combined.slice();

      // Update site context for next pass
      site.fields = fieldMap;
      site.combined = combined;

      // Trace field lines
      const seeds = findSeeds(combined, gw, gh, THRESHOLD, CELL_SIZE, MAP);
      log.push(`  ${seeds.length} seeds → tracing lines`);

      const lines = [];
      for (const seed of seeds) {
        const pts = traceFieldLine(combined, gw, gh, seed.cx, seed.cy, CELL_SIZE, MAP, THRESHOLD);
        if (pts.length < 3) continue;
        const annotated = annotateFieldLine(pts, fieldMap, gw, gh, CELL_SIZE, MAP);
        lines.push({ pts: annotated, seedPressure: seed.v });
      }
      log.push(`  ${lines.length} field lines`);

      allFieldLines = lines;

      snapshots.push({
        pass, combined: combined.slice(), fieldMap, lines,
        seeds: seeds.length, gw, gh,
        delta: prevCombined ? null : null, // populated above
        saturated: !!saturatedAt,
      });

      if (saturatedAt) break;
    }

    if (!saturatedAt) log.push(`Max passes (${MAX_PASSES}) reached without saturation`);

    // Hot nodes: local maxima of pattern-count along lines
    // Sparse — one per distinct high-pressure cluster, not every qualifying point
    const hotNodes = buildHotNodes(allFieldLines);

    // Building footprints from hot node clusters
    const buildings = buildFootprints(hotNodes, CELL_SIZE);

    log.push(`${hotNodes.length} hot nodes | ${buildings.length} building footprints`);
    log.push(`Done in ${snapshots.length} passes.`);

    return {
      snapshots, fieldLines: allFieldLines, hotNodes, buildings,
      log, gw, gh, cellSize: CELL_SIZE, MAP, ftToSvg,
      saturatedAt,
      patternColors: Object.fromEntries(
        Object.entries(PATTERNS).map(([id,p])=>[id,p.color])
      ),
      patternNames: Object.fromEntries(
        Object.entries(PATTERNS).map(([id,p])=>[id,p.name])
      ),
    };
  }

  // Sparse hot nodes: local maxima of simultaneous pattern count along lines.
  // One node per high-pressure peak, not every qualifying point.
  function buildHotNodes(lines) {
    const candidates = [];
    for (const line of lines) {
      // Count strong patterns at each point
      const scored = line.pts.map(pt => ({
        ...pt,
        nStrong: Object.values(pt.weights||{}).filter(w=>w>0.28).length
      }));
      // Find local maxima of nStrong along the line
      for (let i=1;i<scored.length-1;i++) {
        const p=scored[i];
        if (p.nStrong < 3) continue;
        if (p.nStrong >= scored[i-1].nStrong && p.nStrong >= scored[i+1].nStrong) {
          candidates.push(p);
        }
      }
    }
    // Deduplicate: keep one per 40px neighbourhood
    const kept = [];
    for (const c of candidates.sort((a,b)=>b.nStrong-a.nStrong)) {
      if (kept.some(k=>Math.hypot(k.x-c.x,k.y-c.y)<16)) continue;
      kept.push(c);
    }
    return kept;
  }

  // Building footprints: cluster hot nodes spatially, fit rectangles.
  // Each building is the bounding box of a cluster, oriented to the spine.
  function buildFootprints(hotNodes, cellSize) {
    if (hotNodes.length === 0) return [];
    const minDist = Math.max(cellSize*3.5, 28);
    // Single-linkage clustering
    const clusters = [];
    const assigned = new Uint8Array(hotNodes.length);
    for (let i=0;i<hotNodes.length;i++) {
      if (assigned[i]) continue;
      const cluster = [hotNodes[i]];
      assigned[i] = 1;
      for (let j=i+1;j<hotNodes.length;j++) {
        if (assigned[j]) continue;
        if (cluster.some(c=>Math.hypot(c.x-hotNodes[j].x,c.y-hotNodes[j].y)<minDist)) {
          cluster.push(hotNodes[j]);
          assigned[j] = 1;
        }
      }
      clusters.push(cluster);
    }
    // Fit axis-aligned rectangle to each cluster, padded slightly
    const pad = cellSize*1.5;
    return clusters.map(pts => {
      const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
      const x=Math.min(...xs)-pad, y=Math.min(...ys)-pad;
      const w=Math.max(...xs)-Math.min(...xs)+pad*2;
      const h=Math.max(...ys)-Math.min(...ys)+pad*2;
      // Dominant pattern = most common top pattern across cluster pts
      const tally = {};
      for (const pt of pts) {
        const top=Object.entries(pt.weights||{}).sort((a,b)=>b[1]-a[1])[0];
        if(top) tally[top[0]]=(tally[top[0]]||0)+1;
      }
      const domPid = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0];
      const avgStrong = pts.reduce((s,p)=>s+p.nStrong,0)/pts.length;
      return { x, y, w, h, pts: pts.length, domPid, avgStrong };
    }).filter(b=>b.w>8&&b.h>8); // discard degenerate singletons
  }

  return { solve, PATTERNS };
})();

    const sphericalDelta = new THREE.Spherical();

    }
    function panUp(distance, objectMatrix) {
      const v = new THREE.Vector3(); v.setFromMatrixColumn(objectMatrix, 1); v.multiplyScalar(distance); panOffset.add(v);

      panUp(deltaY * t / el.clientHeight, scope.object.matrix);

    domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    domElement.addEventListener('touchmove', onTouchMove, { passive: false });

      e.preventDefault();

      else if (e.button === 1 || (e.button === 0 && e.shiftKey)) { state = STATE.PAN; panStart.set(e.clientX, e.clientY); }

    function onMouseUp() { document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); state = STATE.NONE; }

        const dx = e.touches[0].clientX - e.touches[1].clientX;

// GREENERY — P171 Tree Places + P51 Green Streets
//
// P171: Trees as social markers — placed at activity nodes, courtyard entries,
//       path intersections. Not decoration; they mark where life concentrates.
// P51:  Green Streets — tree rows along movement corridors (spine edges,
//       main street band edge, sponge park rim).

// Tree geometry: trunk (CylinderGeometry) + canopy (SphereGeometry).
// Species variation encoded by canopy shape and color.
// ══════════════════════════════════════════════════════════════════════════════

const gTrees = new THREE.Group();
scene.add(gTrees);

// Canopy colors — four species types
const CANOPY_COLORS = [
  new THREE.Color(0x3a6b2a), // deep oak
  new THREE.Color(0x4a7c35), // maple mid
  new THREE.Color(0x2d5e20), // pine dark
  new THREE.Color(0x5a8c40), // birch light
];
const TRUNK_COLOR = new THREE.Color(0x5a3a20);

// Shared geometries (instanced for performance)
const trunkGeo = new THREE.CylinderGeometry(0.6, 0.9, 1, 6);
const canopyGeos = [
  new THREE.SphereGeometry(1, 7, 5),                          // round oak
  new THREE.SphereGeometry(1, 7, 5).scale(1, 1.3, 1),        // tall maple — scale returns geo
  new THREE.ConeGeometry(1, 2.2, 7),                          // conical pine
  new THREE.SphereGeometry(1, 7, 5).scale(1.3, 0.85, 1.3),   // spreading birch
];
// Note: .scale() on BufferGeometry returns the geometry itself, so these are valid.

function makeTree(group, fx, fy, trunkH, canopyR, species) {
  species = species % 4;
  const pos = ftTo3(fx, fy, 0);

  // Trunk
  const tMat = new THREE.MeshLambertMaterial({ color: TRUNK_COLOR });
  const tGeo = new THREE.CylinderGeometry(0.6, 0.9, trunkH, 6);
  tGeo.translate(0, trunkH / 2, 0);
  const trunk = new THREE.Mesh(tGeo, tMat);
  trunk.position.copy(pos);
  group.add(trunk);

  // Canopy
  const cCol = CANOPY_COLORS[species].clone();
  // Slight random hue variation per tree
  cCol.offsetHSL((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.08);
  const cMat = new THREE.MeshLambertMaterial({ color: cCol, transparent: true, opacity: 0.92 });

  const cGeo = species === 2
    ? new THREE.ConeGeometry(canopyR * 0.75, canopyR * 2.2, 7)
    : new THREE.SphereGeometry(canopyR, 7, 5);

  // Scale for species character
  if (species === 3) cGeo.scale(1.3, 0.85, 1.3); // spreading
  else if (species === 1) cGeo.scale(1, 1.3, 1);  // tall

  cGeo.translate(0, 0, 0);
  const canopy = new THREE.Mesh(cGeo, cMat);
  canopy.position.copy(pos);
  canopy.position.y = trunkH + canopyR * (species === 2 ? 1.1 : 0.55);
  group.add(canopy);
}

function buildGreenery(hotNodes, derived, MAP, fieldLines) {
  while (gTrees.children.length) gTrees.remove(gTrees.children[0]);
  if (!derived || !MAP) return;

  const placed = []; // track positions to avoid overlap
  const MIN_DIST = 18; // ft between trees

  function canPlace(fx, fy) {
    for (const [px, py] of placed) {
      if (Math.hypot(fx - px, fy - py) < MIN_DIST) return false;
    }
    return true;
  }
  function plant(fx, fy, trunkH, canopyR, species) {
    if (fx < MAP.x0 || fx > MAP.x1 || fy < MAP.y0 || fy > MAP.y1) return;
    if (!canPlace(fx, fy)) return;
    placed.push([fx, fy]);
    makeTree(gTrees, fx, fy, trunkH, canopyR, species);
  }

  // ── P171: Trees at hot node peaks (activity markers) ─────────────────────
  // Top-tier nodes already have landmark columns — add a tree cluster nearby
  if (hotNodes) {
    const maxS = Math.max(...hotNodes.map(n => n.nStrong));
    const elite = hotNodes.filter(n => n.nStrong >= maxS * 0.6);
    for (const node of elite) {
      // Ring of 3-5 trees around the node at ~20ft radius
      const count = 3 + Math.floor((node.nStrong / maxS) * 2);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + node.x * 0.01;
        const r = 20 + (i % 2) * 8;
        plant(node.x + Math.cos(a) * r, node.y + Math.sin(a) * r,
              12 + Math.random() * 8, 10 + Math.random() * 4, i % 4);
      }
    }
  }

  // ── P51: Green Streets — spine edges ─────────────────────────────────────
  if (derived.SPINE) {
    const s = derived.SPINE;
    const step = 40; // ft between street trees
    for (let fy = MAP.y0 + 20; fy < MAP.y1; fy += step + (Math.random() - 0.5) * 10) {
      // West edge of spine
      plant(s.x - 12, fy, 14, 9, 0);
      // East edge of spine
      plant(s.x + s.w + 12, fy, 14, 9, 0);
    }
  }

  // ── P51: Main street band — street trees along south edge ─────────────────
  if (derived.BAND) {
    const bd = derived.BAND;
    const bandNorthY = bd.y + bd.h;
    const step = 35;
    for (let fx = MAP.x0 + 20; fx < MAP.x1; fx += step + (Math.random() - 0.5) * 8) {
      // Trees just north of band (sidewalk tree strip)
      plant(fx, bandNorthY + 10, 12, 8, 1);
    }
  }

  // ── P106: Sponge park — scattered grove ──────────────────────────────────
  if (derived.SPONGE) {
    const sp = derived.SPONGE;
    // Dense canopy grove in the park ellipse
    // Use a deterministic grid with jitter, keep inside ellipse
    const gridStep = 28;
    let seed = 42;
    const rng = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };
    for (let gx = sp.cx - sp.rx; gx < sp.cx + sp.rx; gx += gridStep) {
      for (let gy = sp.cy - sp.ry; gy < sp.cy + sp.ry; gy += gridStep) {
        const jx = gx + (rng() - 0.5) * gridStep * 0.7;
        const jy = gy + (rng() - 0.5) * gridStep * 0.7;
        // Inside ellipse?
        const ex = (jx - sp.cx) / sp.rx, ey = (jy - sp.cy) / sp.ry;
        if (ex*ex + ey*ey < 0.85) { // slightly inside rim
          const species = Math.floor(rng() * 4);
          plant(jx, jy, 10 + rng() * 8, 8 + rng() * 5, species);
        }
      }
    }
    // Rim planting — denser ring at park edge
    const rimCount = 24;
    for (let i = 0; i < rimCount; i++) {
      const a = (i / rimCount) * Math.PI * 2;
      const r = 0.88 + rng() * 0.08;
      plant(sp.cx + Math.cos(a) * sp.rx * r, sp.cy + Math.sin(a) * sp.ry * r,
            16, 11, i % 4);
    }
  }

  // ── P171: Courtyard trees — one per courtyard void ───────────────────────
  // We don't have courtyard centers directly, so use the exclusion zone centroids
  // from field line seeds that fall in the sponge rim
  if (derived.RESEARCH) {
    const r = derived.RESEARCH;
    // A small grove next to the research station
    for (let i = 0; i < 4; i++) {
      plant(r.x - 15 - i * 14, r.y + r.h / 2 + (i % 2 - 0.5) * 20, 11, 7, 2);
    }
  }
}

// ── CONVERSION HELPERS ────────────────────────────────────────────────────────
// Field solver uses feet coordinates (x=east, y=north, MAP.x0/y0 as southwest origin)
// Three.js: x=east, y=UP, z=south (flip y↔z from solver)
// So: three.x = ft_x - cx, three.z = -(ft_y - cy), three.y = height
let _cx = 0, _cy = 0; // site center for centering scene
function ftTo3(fx, fy, fz=0) {
  return new THREE.Vector3(fx - _cx, fz, -(fy - _cy));
}

// ── GROUND PLANE ──────────────────────────────────────────────────────────────
function buildGround(MAP, parcels, proj) {
  while(gGround.children.length) gGround.remove(gGround.children[0]);
  const cx = (MAP.x0 + MAP.x1)/2, cy = (MAP.y0 + MAP.y1)/2;
  _cx = cx; _cy = cy;

  // EDA parcel outlines as thin walls at y=0
  const edaMat = new THREE.LineBasicMaterial({ color: 0x28502a, opacity: 0.6, transparent: true });
  for (const p of parcels) {
    if (!p.is_eda || !p.rings?.[0]) continue;
    const pts = p.rings[0].map(([lon,lat]) => {
      const [fx,fy] = proj(lon,lat);
      return ftTo3(fx, fy, 0);
    });
    if (pts.length < 3) continue;
    pts.push(pts[0].clone());
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    gGround.add(new THREE.Line(geo, edaMat));
  }

  // Flat ground rectangle
  const gw = MAP.x1 - MAP.x0, gh = MAP.y1 - MAP.y0;
  const geoGround = new THREE.PlaneGeometry(gw, gh);
  const matGround = new THREE.MeshLambertMaterial({ color: 0x0d1a0a, side: THREE.DoubleSide });
  const groundMesh = new THREE.Mesh(geoGround, matGround);
  groundMesh.rotation.x = -Math.PI/2;
  groundMesh.position.set(0, -1, 0);
  gGround.add(groundMesh);

  // Grid
  const gridMat = new THREE.LineBasicMaterial({ color: 0x1a2a18, opacity: 0.3, transparent: true });
  const gridStep = 200; // ft
  for (let gx = Math.ceil(MAP.x0/gridStep)*gridStep; gx <= MAP.x1; gx += gridStep) {
    const pts = [ftTo3(gx, MAP.y0, -0.5), ftTo3(gx, MAP.y1, -0.5)];
    gGround.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
  }
  for (let gy = Math.ceil(MAP.y0/gridStep)*gridStep; gy <= MAP.y1; gy += gridStep) {
    const pts = [ftTo3(MAP.x0, gy, -0.5), ftTo3(MAP.x1, gy, -0.5)];
    gGround.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
  }
}

// PATTERN-DRIVEN BUILDING GEOMETRY

// P106 PositiveOutdoorSpace — U/L courtyard typology; voids mark exclusions

// Add a box mesh (base at y=0) to a group
function addBox(group, cx, cy, w, d, h, mat) {
  const geo = new THREE.BoxGeometry(w, h, d);
  geo.translate(0, h / 2, 0);
  const mesh = new THREE.Mesh(geo, mat);

// Add a top-edge outline rectangle
function addTopRect(group, cx, cy, fw, fh, heightFt, mat) {
  const pts = [
    ftTo3(cx - fw/2, cy - fh/2, heightFt),
    ftTo3(cx + fw/2, cy - fh/2, heightFt),
    ftTo3(cx + fw/2, cy + fh/2, heightFt),
    ftTo3(cx - fw/2, cy + fh/2, heightFt),
    ftTo3(cx - fw/2, cy - fh/2, heightFt),
  ];
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
}

// ══════════════════════════════════════════════════════════════════════════════
// FACADE DETAIL — pattern-driven surface articulation
//
// P122 Building Fronts  — active ground floor base, distinct from shaft
// P127 Intimacy Gradient — public face open/banded, rear face solid/recessed
// P121 Path Shape        — recessed entry notch on the street-facing face
// P164 Street Windows    — horizontal fenestration bands per floor
// P166 Gallery Surround  — cornice/ledge line at each floor level
// ══════════════════════════════════════════════════════════════════════════════

// Which face is "public" (street-facing)?
// In ft coords: south face = low-y edge (toward main street / BAND).
// North face = high-y edge (toward housing / park).
// Returns 'S' | 'N' | 'E' | 'W' based on which derived zone the block faces.
function publicFace(blk, derived) {
  const bd = derived.BAND;
  const sp = derived.SPINE;
  if (!sp) return 'S';
  const spineX = sp.x + sp.w / 2;
  // Blocks east of spine face west (toward spine)
  // Blocks west of spine face east (toward spine)
  // Blocks near band face south
  if (bd && blk.cy < bd.y + bd.h + 200) return 'S';
  if (blk.cx > spineX + sp.w) return 'W';
  if (blk.cx < spineX - sp.w) return 'E';
  return 'S';
}

// P166: Floor-level cornice lines on all four faces of a box
// Thin horizontal lines at each floor level — encodes vertical rhythm
function addFloorBands(group, cx, cy, fw, fh, heightFt, floors, col) {
  if (floors < 2) return;
  const floorH = heightFt / floors;
  const bandMat = new THREE.LineBasicMaterial({
    color: col.clone().multiplyScalar(1.5),
    transparent: true, opacity: 0.45
  });
  const hw = fw / 2, hd = fh / 2;

  for (let f = 1; f < floors; f++) {
    const y = f * floorH;
    // All four faces as horizontal lines at this floor level
    const faces = [
      // South face (low-z in three.js)
      [ftTo3(cx-hw, cy-hd, y), ftTo3(cx+hw, cy-hd, y)],
      // North face
      [ftTo3(cx-hw, cy+hd, y), ftTo3(cx+hw, cy+hd, y)],
      // West face
      [ftTo3(cx-hw, cy-hd, y), ftTo3(cx-hw, cy+hd, y)],
      // East face
      [ftTo3(cx+hw, cy-hd, y), ftTo3(cx+hw, cy+hd, y)],
    ];
    for (const [a, b] of faces) {
      group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([a, b]), bandMat.clone()
      ));
    }
  }
}

// P122: Base differentiation — ground floor as distinct volume
// Ground floor: slightly wider, lighter color (active, permeable)
// Returns the base height used so shaft can start above it
function addBase122(group, cx, cy, fw, fh, heightFt, floors, col) {
  const baseFloors = 1;
  const baseH = (heightFt / floors) * baseFloors;
  const baseExpand = 4; // ft overhang beyond shaft

  // Base: slightly wider, warmer, more opaque
  const baseMat = new THREE.MeshLambertMaterial({
    color: col.clone().lerp(new THREE.Color(0.9, 0.8, 0.6), 0.18),
    opacity: 0.95, transparent: true
  });
  const baseGeo = new THREE.BoxGeometry(fw + baseExpand, baseH, fh + baseExpand);
  baseGeo.translate(0, baseH / 2, 0);
  const baseMesh = new THREE.Mesh(baseGeo, baseMat);
  baseMesh.position.copy(ftTo3(cx, cy, 0));
  group.add(baseMesh);

  // Base top edge — slightly brighter line
  const baseEdgeMat = new THREE.LineBasicMaterial({
    color: col.clone().lerp(new THREE.Color(1, 0.9, 0.7), 0.3).multiplyScalar(1.4),
    transparent: true, opacity: 0.6
  });
  const bew = (fw + baseExpand) / 2, bed = (fh + baseExpand) / 2;
  const bePts = [
    ftTo3(cx-bew, cy-bed, baseH), ftTo3(cx+bew, cy-bed, baseH),
    ftTo3(cx+bew, cy+bed, baseH), ftTo3(cx-bew, cy+bed, baseH),
    ftTo3(cx-bew, cy-bed, baseH)
  ];
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(bePts), baseEdgeMat));

  return baseH;
}

// P164: Fenestration bands — horizontal window-strip geometry on public face
// Implemented as a series of thin flat planes (glass-like) per floor
function addWindowBands(group, cx, cy, fw, fh, baseH, heightFt, floors, col, face) {
  if (floors < 2) return;
  const floorH = (heightFt - baseH) / Math.max(floors - 1, 1);
  const winH = floorH * 0.38; // window occupies 38% of floor height
  const winInset = 1.5; // ft inset from face
  const winMat = new THREE.MeshBasicMaterial({
    color: col.clone().lerp(new THREE.Color(0.7, 0.85, 1.0), 0.4).multiplyScalar(1.2),
    transparent: true, opacity: 0.25, side: THREE.DoubleSide
  });

  const hw = fw / 2, hd = fh / 2;

  for (let f = 1; f < floors; f++) {
    const yBot = baseH + (f - 1) * floorH + floorH * 0.15;
    const yTop = yBot + winH;
    const yMid = (yBot + yTop) / 2;
    const winHh = winH / 2;

    let geo, pos;
    if (face === 'S') {
      geo = new THREE.PlaneGeometry(fw * 0.82, winH);
      pos = ftTo3(cx, cy - hd + winInset, yMid);
      // no rotation needed — PlaneGeometry faces +z by default in Three.js
    } else if (face === 'N') {
      geo = new THREE.PlaneGeometry(fw * 0.82, winH);
      pos = ftTo3(cx, cy + hd - winInset, yMid);
    } else if (face === 'W') {
      geo = new THREE.PlaneGeometry(fh * 0.82, winH);
      pos = ftTo3(cx - hw + winInset, cy, yMid);
      geo.rotateY(Math.PI / 2);
    } else { // E
      geo = new THREE.PlaneGeometry(fh * 0.82, winH);
      pos = ftTo3(cx + hw - winInset, cy, yMid);
      geo.rotateY(Math.PI / 2);
    }

    const mesh = new THREE.Mesh(geo, winMat.clone());
    mesh.position.copy(pos);
    group.add(mesh);
  }
}

// P121: Entry recess — small notch box on public face, ground floor only
function addEntryRecess(group, cx, cy, fw, fh, baseH, col, face) {
  const recessW = Math.min(fw * 0.22, 20); // ft wide
  const recessD = 6; // ft deep
  const recessH = baseH * 0.92;
  const darkMat = new THREE.MeshLambertMaterial({
    color: col.clone().multiplyScalar(0.35), opacity: 0.95, transparent: true
  });

  let rx, ry;
  const hw = fw / 2, hd = fh / 2;
  if (face === 'S')      { rx = cx; ry = cy - hd + recessD / 2; }
  else if (face === 'N') { rx = cx; ry = cy + hd - recessD / 2; }
  else if (face === 'W') { rx = cx - hw + recessD / 2; ry = cy; }
  else                   { rx = cx + hw - recessD / 2; ry = cy; }

  const isNS = face === 'S' || face === 'N';
  const rw = isNS ? recessW : recessD;
  const rd = isNS ? recessD  : recessW;

  addBox(group, rx, ry, rw, rd, recessH, darkMat);
}

// P127: Intimacy gradient — rear face (opposite public) gets a parapet bump
// A small solid element at the top of the rear face signals the private edge
function addParapet127(group, cx, cy, fw, fh, heightFt, col, face) {
  const parapetH = 3 * HT_SCALE; // ~3ft visible bump
  const parapetD = 6; // ft depth
  const parapetMat = new THREE.MeshLambertMaterial({
    color: col.clone().multiplyScalar(0.8), opacity: 0.9, transparent: true
  });

  // Rear face = opposite of public face
  const hw = fw / 2, hd = fh / 2;
  let rx, ry, pw, pd;
  if (face === 'S')      { rx = cx; ry = cy + hd - parapetD/2; pw = fw; pd = parapetD; }
  else if (face === 'N') { rx = cx; ry = cy - hd + parapetD/2; pw = fw; pd = parapetD; }
  else if (face === 'W') { rx = cx + hw - parapetD/2; ry = cy; pw = parapetD; pd = fh; }
  else                   { rx = cx - hw + parapetD/2; ry = cy; pw = parapetD; pd = fh; }

  const geo = new THREE.BoxGeometry(pw, parapetH, pd);
  geo.translate(0, parapetH / 2, 0);
  const mesh = new THREE.Mesh(geo, parapetMat);
  // position at top of building
  const base3 = ftTo3(rx, ry, 0);
  mesh.position.set(base3.x, heightFt, base3.z);
  group.add(mesh);
}

// ── MASTER DETAIL APPLICATOR ─────────────────────────────────────────────────
// Called instead of bare addBox for the main building shaft.
// Applies all relevant pattern details based on typology + floor count.
function addDetailedBuilding(group, blk, heightFt, col, derived) {
  const { cx, cy, fw, fh, floors, typology } = blk;
  const face = publicFace(blk, derived);

  // Main shaft material
  const shaftMat = new THREE.MeshLambertMaterial({
    color: col, opacity: 0.88, transparent: true
  });
  const edgeMat = new THREE.LineBasicMaterial({
    color: col.clone().multiplyScalar(1.1), opacity: 0.18, transparent: true
  });

  // P122: Base — always applied (ground floor is always active)
  const baseH = addBase122(group, cx, cy, fw, fh, heightFt, floors, col);

  // Shaft above base
  const shaftH = heightFt - baseH;
  if (shaftH > 4) {
    const shaftCY_world = baseH + shaftH / 2;
    const shaftGeo = new THREE.BoxGeometry(fw, shaftH, fh);
    shaftGeo.translate(0, shaftH / 2, 0);
    const shaftMesh = new THREE.Mesh(shaftGeo, shaftMat.clone());
    const pos = ftTo3(cx, cy, 0);
    shaftMesh.position.set(pos.x, baseH, pos.z);
    group.add(shaftMesh);
  }

  // Top edge
  addTopRect(group, cx, cy, fw, fh, heightFt, edgeMat.clone());

  // P166/P164/P121/P127 — routed to gDetail (LOD: only shown when zoomed in)
  const dg = gDetail;
  if (floors >= 2) addFloorBands(dg, cx, cy, fw, fh, heightFt, floors, col);
  if (floors >= 3) addWindowBands(dg, cx, cy, fw, fh, baseH, heightFt, floors, col, face);
  addEntryRecess(dg, cx, cy, fw, fh, baseH, col, face);
  if (floors >= 4) addParapet127(dg, cx, cy, fw, fh, heightFt, col, face);
}


// ── TYPOLOGY CLASSIFIERS ─────────────────────────────────────────────────────

// P106: Is this block centroid inside a protected outdoor zone?
// If yes → exclusion (don't build), mark as void/park.
function isExclusion(blk, derived) {
  const { cx, cy } = blk;
  // SPONGE park ellipse
  const sp = derived.SPONGE;
  if (sp) {
    const ex = (cx - sp.cx) / (sp.rx + 40), ey = (cy - sp.cy) / (sp.ry + 40);
    if (ex*ex + ey*ey < 1) return 'sponge';
  }
  // BASIN (water feature — hard exclusion)
  const ba = derived.BASIN;
  if (ba) {
    const ex = (cx - ba.cx) / (ba.rx + 20), ey = (cy - ba.cy) / (ba.ry + 20);
    if (ex*ex + ey*ey < 1) return 'basin';
  }
  // BAND (main street zone — no tall buildings, handle separately)
  const bd = derived.BAND;
  if (bd && cy < bd.y + bd.h && cy > bd.y) return 'band';
  // TIDE station (transit plaza)
  const td = derived.TIDE;
  if (td && cx > td.x && cx < td.x+td.w && cy > td.y && cy < td.y+td.h) return 'tide';
  return null;
}

// P106: Should this block be a courtyard typology?
// Yes if: large cluster, near public edge, not on spine
function isCourtyardTypology(blk, derived) {
  const sp = derived.SPONGE;
  if (!sp) return false;
  // Near sponge park but outside it → wrap it with U-shape
  const distToSponge = Math.hypot(blk.cx - sp.cx, blk.cy - sp.cy);
  const rim = Math.max(sp.rx, sp.ry) + 80;
  if (distToSponge < rim && distToSponge > Math.min(sp.rx, sp.ry)) return true;
  // Large block count → enough pressure to warrant courtyard
  if (blk.count > 12 && blk.fw > 100 && blk.fh > 100) return true;
  return false;
}

// P119: Should this block have an arcade base?
// Yes if: on spine edge, or adjacent to BAND (main street)
function isArcadeTypology(blk, derived) {
  const sp = derived.SPINE;
  if (!sp) return false;
  const distToSpine = Math.abs(blk.cx - (sp.x + sp.w/2));
  if (distToSpine < sp.w * 1.5) return true;
  const bd = derived.BAND;
  if (bd && blk.cy < bd.y + bd.h + 80) return true;
  return false;
}

// P105: South notch direction — fraction [0..1] of depth to cut from south face
function southNotchDepth(blk, derived) {
  // Bigger notch farther from spine (more ground-level scale)
  const sp = derived.SPINE;
  if (!sp) return 0;
  const dist = Math.abs(blk.cx - (sp.x + sp.w/2));
  const t = Math.min(dist / 500, 1);
  return 0.15 + t * 0.2; // 15-35% of depth
}

// ── GEOMETRY BUILDERS ─────────────────────────────────────────────────────────

// Solid box with P105 south notch
// The notch is a rectangular void on the south face (low-z in Three.js = low-y in ft)
// Implemented as two boxes: east wing + west wing with gap in south face
function buildP105Solid(group, blk, heightFt, col) {
  const { cx, cy, fw, fh } = blk;
  const notchD = fh * southNotchDepth(blk, { SPINE: group._derived?.SPINE });
  const notchW = fw * 0.45; // 45% of width open to south

  const mat = new THREE.MeshLambertMaterial({ color: col, opacity: 0.88, transparent: true });
  const edgeMat = new THREE.LineBasicMaterial({ color: col.clone().multiplyScalar(1.6), opacity: 0.55, transparent: true });

  // North slab (full width, full depth minus notch)
  const northD = fh - notchD;
  const northCY = cy + notchD / 2; // shifted north
  addBox(group, cx, northCY, fw, northD, heightFt, mat.clone());
  addTopRect(group, cx, northCY, fw, northD, heightFt, edgeMat.clone());

  // West wing (fills south-west)
  const wingW = (fw - notchW) / 2;
  if (wingW > 8) {
    const wingCX = cx - notchW/2 - wingW/2;
    addBox(group, wingCX, cy - fh/2 + notchD/2, wingW, notchD, heightFt * 0.7, mat.clone());
    addTopRect(group, wingCX, cy - fh/2 + notchD/2, wingW, notchD, heightFt * 0.7, edgeMat.clone());
  }
  // East wing
  if (wingW > 8) {
    const wingCX = cx + notchW/2 + wingW/2;
    addBox(group, wingCX, cy - fh/2 + notchD/2, wingW, notchD, heightFt * 0.7, mat.clone());
    addTopRect(group, wingCX, cy - fh/2 + notchD/2, wingW, notchD, heightFt * 0.7, edgeMat.clone());
  }
}

// P106 U-shape: three arms wrapping a south-facing courtyard
// courtyard opens toward sponge park (or south if no park reference)
// openDir: 'S' | 'N' | 'E' | 'W'
function buildP106Courtyard(group, blk, heightFt, col, openDir) {
  const { cx, cy, fw, fh } = blk;
  const mat = new THREE.MeshLambertMaterial({ color: col, opacity: 0.88, transparent: true });
  const edgeMat = new THREE.LineBasicMaterial({ color: col.clone().multiplyScalar(1.6), opacity: 0.55, transparent: true });

  const wallW = Math.max(fw * 0.28, 28); // arm width ~28% of total
  const wallD = Math.max(fh * 0.28, 28);
  const lowerH = heightFt * 0.65; // side arms slightly lower

  if (openDir === 'S' || openDir === 'N') {
    const armD = fh * 0.65;
    const backY = openDir === 'S' ? cy + (fh - armD) / 2 : cy - (fh - armD) / 2;
    const armY  = openDir === 'S' ? cy - (fh - armD) / 2 : cy + (fh - armD) / 2;

    // Back wall (opposite open face) — full height
    addBox(group, cx, backY, fw, fh - armD, heightFt, mat.clone());
    addTopRect(group, cx, backY, fw, fh - armD, heightFt, edgeMat.clone());

    // Left arm
    addBox(group, cx - (fw - wallW) / 2, armY, wallW, armD, lowerH, mat.clone());
    addTopRect(group, cx - (fw - wallW) / 2, armY, wallW, armD, lowerH, edgeMat.clone());

    // Right arm
    addBox(group, cx + (fw - wallW) / 2, armY, wallW, armD, lowerH, mat.clone());
    addTopRect(group, cx + (fw - wallW) / 2, armY, wallW, armD, lowerH, edgeMat.clone());

  } else { // E or W
    const armW = fw * 0.65;
    const backX = openDir === 'E' ? cx - (fw - armW) / 2 : cx + (fw - armW) / 2;
    const armX  = openDir === 'E' ? cx + (fw - armW) / 2 : cx - (fw - armW) / 2;

    addBox(group, backX, cy, fw - armW, fh, heightFt, mat.clone());
    addTopRect(group, backX, cy, fw - armW, fh, heightFt, edgeMat.clone());

    addBox(group, armX, cy - (fh - wallD) / 2, armW, wallD, lowerH, mat.clone());
    addTopRect(group, armX, cy - (fh - wallD) / 2, armW, wallD, lowerH, edgeMat.clone());

    addBox(group, armX, cy + (fh - wallD) / 2, armW, wallD, lowerH, mat.clone());
    addTopRect(group, armX, cy + (fh - wallD) / 2, armW, wallD, lowerH, edgeMat.clone());
  }
  // P166/P164 detail on courtyard arms — LOD group
  const floors = blk.floors;
  if (floors >= 2) addFloorBands(gDetail, cx, cy, fw, fh, heightFt, floors, col);
  if (floors >= 3) addWindowBands(gDetail, cx, cy, fw, fh, 0, heightFt, floors, col, openDir === 'S' ? 'N' : openDir === 'N' ? 'S' : openDir === 'E' ? 'W' : 'E');
  addEntryRecess(gDetail, cx, cy, fw, fh, heightFt/floors, col, openDir);
}

// P119 Arcade: two-part section — wide low base + narrower tower
function buildP119Arcade(group, blk, heightFt, col) {
  const { cx, cy, fw, fh } = blk;
  const mat = new THREE.MeshLambertMaterial({ color: col, opacity: 0.88, transparent: true });
  const edgeMat = new THREE.LineBasicMaterial({ color: col.clone().multiplyScalar(1.6), opacity: 0.55, transparent: true });

  const arcadeH = 14; // ~1 floor in ft (actual, unscaled)
  const arcadeExt = 12; // ft overhang on street edge
  const towerW = fw * 0.72;
  const towerD = fh * 0.72;

  // Full-footprint arcade base (1 floor, wider)
  addBox(group, cx, cy, fw + arcadeExt, fh, arcadeH * HT_SCALE, mat.clone());
  addTopRect(group, cx, cy, fw + arcadeExt, fh, arcadeH * HT_SCALE, edgeMat.clone());

  // Tower above arcade
  const towerH = Math.max(heightFt - arcadeH * HT_SCALE, 20);
  addBox(group, cx, cy, towerW, towerD, towerH, mat.clone());
  // top rect at full tower height
  addTopRect(group, cx, cy, towerW, towerD, arcadeH * HT_SCALE + towerH, edgeMat.clone());
}

// P106 exclusion zone: render as a glowing park void, not a building
function buildExclusionVoid(group, blk, exclusionType, derived) {
  const { cx, cy, fw, fh } = blk;
  let col, label;
  if (exclusionType === 'sponge' || exclusionType === 'basin') {
    col = new THREE.Color(0x1a4a30); // deep green
  } else if (exclusionType === 'band') {
    col = new THREE.Color(0x2a2a18); // dark street tone
  } else {
    col = new THREE.Color(0x1a2a3a); // neutral void
  }

  // Low platform at ground — marks the void
  const platH = 1.5 * HT_SCALE;
  const geo = new THREE.BoxGeometry(fw, platH, fh);
  geo.translate(0, platH / 2, 0);
  const mat = new THREE.MeshLambertMaterial({ color: col, opacity: 0.4, transparent: true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(ftTo3(cx, cy, 0));
  group.add(mesh);

  // Dashed perimeter at grade
  const perimMat = new THREE.LineBasicMaterial({ color: 0x40a070, opacity: 0.35, transparent: true });
  const pts = [
    ftTo3(cx-fw/2, cy-fh/2, 1), ftTo3(cx+fw/2, cy-fh/2, 1),
    ftTo3(cx+fw/2, cy+fh/2, 1), ftTo3(cx-fw/2, cy+fh/2, 1),
    ftTo3(cx-fw/2, cy-fh/2, 1),
  ];
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), perimMat));
}

// ── CLUSTER + ASSIGN TYPOLOGIES ───────────────────────────────────────────────

function clusterUrbanBlocks(hotNodes, derived) {
  if (!hotNodes || !hotNodes.length) return [];

  const R = 150; // ft cluster radius — one city block
  const used = new Uint8Array(hotNodes.length);
  const blocks = [];
  const sorted = hotNodes.map((n,i) => ({...n, _i: i})).sort((a,b) => b.nStrong - a.nStrong);

  for (const seed of sorted) {
    if (used[seed._i]) continue;
    const members = [seed];
    used[seed._i] = 1;
    for (const n of sorted) {
      if (used[n._i]) continue;
      if (Math.hypot(n.x - seed.x, n.y - seed.y) < R) {
        members.push(n);
        used[n._i] = 1;
      }
    }

    const xs = members.map(n => n.x), ys = members.map(n => n.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const fw = Math.max(40, Math.min(180, maxX - minX + 40));
    const fh = Math.max(40, Math.min(180, maxY - minY + 40));

    // P116: spine distance → floors
    const spineX = derived.SPINE ? derived.SPINE.x + derived.SPINE.w/2 : 0;
    const distFromSpine = Math.abs(cx - spineX);
    const t = Math.min(distFromSpine / 550, 1);
    const floors = 7 - Math.round(t * 4);

    // Dominant pattern
    const tally = {};
    for (const m of members) {
      const top = Object.entries(m.weights || {}).sort((a,b) => b[1]-a[1])[0];
      if (top) tally[top[0]] = (tally[top[0]] || 0) + 1;
    }
    const domPid = Object.entries(tally).sort((a,b) => b[1]-a[1])[0]?.[0];
    const avgStrong = members.reduce((s,m) => s + m.nStrong, 0) / members.length;

    // P106 exclusion check
    const excl = isExclusion({ cx, cy, fw, fh }, derived);

    // Typology assignment
    let typology = 'solid'; // default
    if (!excl) {
      if (isCourtyardTypology({ cx, cy, fw, fh, count: members.length }, derived)) {
        typology = 'courtyard';
      } else if (isArcadeTypology({ cx, cy }, derived)) {
        typology = 'arcade';
      } else if (floors >= 5) {
        typology = 'p105'; // south notch on taller buildings
      }
    } else {
      typology = 'exclusion';
    }

    // Courtyard open direction: face toward sponge park
    let openDir = 'S';
    if (typology === 'courtyard' && derived.SPONGE) {
      const dx = derived.SPONGE.cx - cx, dy = derived.SPONGE.cy - cy;
      if (Math.abs(dx) > Math.abs(dy)) openDir = dx > 0 ? 'E' : 'W';
      else openDir = dy > 0 ? 'N' : 'S';
    }

    blocks.push({ cx, cy, fw, fh, floors, domPid, avgStrong, count: members.length,
                  typology, openDir, exclusion: excl });
  }
  return blocks;
}

function buildBuildings(buildings, derived, PATTERNS, hotNodes) {
  while(gBuildings.children.length) gBuildings.remove(gBuildings.children[0]);
  while(gDetail.children.length) gDetail.remove(gDetail.children[0]);

  const blocks = clusterUrbanBlocks(hotNodes, derived);
  if (!blocks.length) return;

  // Zone-semantic color: typology + position drive hue family.
  // Pattern ID gives a subtle secondary shift; floors control value.
  // This keeps the field information without full-saturation chaos.
  function blockColor(blk, floors, derived) {
    const { cx, cy, typology } = blk;
    const sp = derived.SPINE;
    const spineX = sp ? sp.x + sp.w / 2 : 0;
    const distFromSpine = Math.abs(cx - spineX);
    const spineW = sp ? sp.w : 120;
    const bandTop = derived.BAND ? derived.BAND.y + derived.BAND.h : 0;
    const sponge = derived.SPONGE;

    // Value: taller = slightly lighter (but never washed out)
    const v = 0.55 + (floors - 3) * 0.06; // 0.55–0.79

    let h, s; // HSL hue (0-360), saturation (0-1)

    // Spine zone (within 1.5× spine width)
    if (distFromSpine < spineW * 1.5) {
      h = 34; s = 0.52; // warm stone amber
    }
    // Park-adjacent (near sponge)
    else if (sponge && Math.hypot(cx - sponge.cx, cy - sponge.cy) < Math.max(sponge.rx, sponge.ry) + 200) {
      h = 145; s = 0.28; // desaturated sage — recedes, doesn't fight park
    }
    // Main street / band edge (south)
    else if (cy < bandTop + 120) {
      h = 38; s = 0.60; // ochre commercial
    }
    // Housing zone (north of sponge, far from spine)
    else if (distFromSpine > spineW * 2) {
      h = 230; s = 0.30; // cool slate — residential, quiet
    }
    // Mid zone — mixed use
    else {
      h = 200; s = 0.32; // muted steel blue-grey
    }

    // Pattern ID gives ±15° hue shift — preserves field info without dominating
    const pid = parseInt(blk.domPid) || 0;
    const hueShift = ((pid * 37) % 30) - 15;
    h = (h + hueShift + 360) % 360;

    // Convert HSL → RGB
    const c = (1 - Math.abs(2 * v - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c / 2;
    let rr, gg, bb;
    if      (h < 60)  { rr=c; gg=x; bb=0; }
    else if (h < 120) { rr=x; gg=c; bb=0; }
    else if (h < 180) { rr=0; gg=c; bb=x; }
    else if (h < 240) { rr=0; gg=x; bb=c; }
    else if (h < 300) { rr=x; gg=0; bb=c; }
    else              { rr=c; gg=0; bb=x; }
    return new THREE.Color(rr+m, gg+m, bb+m);
  }

  // Attach derived to group so helpers can access it (P105 notch depth needs SPINE)
  gBuildings._derived = derived;

  for (const blk of blocks) {
    const heightFt = blk.floors * 12 * HT_SCALE;
    const col = blockColor(blk, blk.floors, derived);

    if (blk.typology === 'exclusion') {
      buildExclusionVoid(gBuildings, blk, blk.exclusion, derived);
    } else if (blk.typology === 'courtyard') {
      buildP106Courtyard(gBuildings, blk, heightFt, col, blk.openDir);
    } else if (blk.typology === 'arcade') {
      buildP119Arcade(gBuildings, blk, heightFt, col);
    } else if (blk.typology === 'p105') {
      // Give p105 helper access to derived via closure
      const savedDerived = derived;
      const blkWithDerived = { ...blk };
      // Inline south notch depth (no closure trick needed — just pass derived)
      const notchD = blk.fh * (0.15 + Math.min(Math.abs(blk.cx - (derived.SPINE?.x + derived.SPINE?.w/2 || 0)) / 500, 1) * 0.2);
      const notchW = blk.fw * 0.45;
      const mat = new THREE.MeshLambertMaterial({ color: col, opacity: 0.88, transparent: true });
      const edgeMat = new THREE.LineBasicMaterial({ color: col.clone().multiplyScalar(1.6), opacity: 0.55, transparent: true });
      // North slab — detailed
      const northD = blk.fh - notchD;
      const northCY = blk.cy + notchD / 2;
      const northBlk = {...blk, cy: northCY, fh: northD};
      addDetailedBuilding(gBuildings, northBlk, heightFt, col, derived);
      // Wings — detailed (shorter)
      const wingW = (blk.fw - notchW) / 2;
      if (wingW > 8) {
        [-1, 1].forEach(side => {
          const wingCX = blk.cx + side * (notchW/2 + wingW/2);
          const wingCY = blk.cy - blk.fh/2 + notchD/2;
          const wingBlk = {...blk, cx: wingCX, cy: wingCY, fw: wingW, fh: notchD, floors: Math.max(Math.round(blk.floors * 0.7), 2)};
          addDetailedBuilding(gBuildings, wingBlk, heightFt * 0.7, col, derived);
        });
      }
    } else {
      // Solid — P122/P127/P164/P166 facade detail
      addDetailedBuilding(gBuildings, blk, heightFt, col, derived);
    }
  }
}


// ── FIELD LINES ───────────────────────────────────────────────────────────────
function buildFieldLines(fieldLines, MAP, PATTERNS) {
  while(gLines.children.length) gLines.remove(gLines.children[0]);
  if (!fieldLines || !fieldLines.length) return;

  // Only top 50% by seed pressure — reduce clutter
  const pressures = fieldLines.map(l => l.seedPressure || 0).sort((a,b) => b-a);
  const cutoff = pressures[Math.floor(pressures.length * 0.5)] || 0;

  let maxP = 0;
  for (const line of fieldLines) for (const pt of line.pts) if ((pt.v||0) > maxP) maxP = pt.v||0;
  if (maxP === 0) maxP = 1;

  // Tallest building height estimate for elevation base
  const maxBldgH = 7 * 12 * HT_SCALE;

  for (const line of fieldLines) {
    if ((line.seedPressure||0) < cutoff) continue;
    const pts = line.pts;
    if (pts.length < 3) continue;

    // Float field lines above buildings
    const points3 = pts.map(pt => {
      const pNorm = (pt.v || 0) / maxP;
      const heightFt = maxBldgH + 20 + pNorm * 60 * HT_SCALE;
      return ftTo3(pt.x, pt.y, heightFt);
    });

    // Dominant pattern at midpoint
    let domPid = null, domW = 0;
    const mid = pts[Math.floor(pts.length/2)];
    if (mid.weights) {
      for (const [pid, w] of Object.entries(mid.weights)) {
        if (w > domW) { domW = w; domPid = pid; }
      }
    }
    const lineColor = (PATTERNS[domPid] && PATTERNS[domPid].color)
      ? hexColor(PATTERNS[domPid].color) : 0x80c080;
    const opacity = 0.5 + (line.seedPressure || 0) * 0.4;

    const mat = new THREE.LineBasicMaterial({ color: lineColor, transparent: true, opacity: Math.min(opacity, 0.92) });
    gLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points3), mat));
  }
}

// ── HOT NODES ─────────────────────────────────────────────────────────────────
// Only render top-tier nodes — these become landmark/activity markers
function buildHotNodes3D(hotNodes, PATTERNS) {
  while(gNodes.children.length) gNodes.remove(gNodes.children[0]);
  if (!hotNodes || !hotNodes.length) return;

  const maxStrong = Math.max(...hotNodes.map(n => n.nStrong));
  // Only top 8% by nStrong = true activity peaks
  const threshold = maxStrong * 0.72;
  const elite = hotNodes.filter(n => n.nStrong >= threshold);
  if (!elite.length) return;

  for (const node of elite) {
    const t = (node.nStrong - threshold) / Math.max(maxStrong - threshold, 1);
    const h = (60 + t * 120) * HT_SCALE; // 60-180ft above ground
    const r = 12 + t * 18;

    let domPid = null, domW = 0;
    if (node.weights) {
      for (const [pid, w] of Object.entries(node.weights)) {
        if (w > domW) { domW = w; domPid = pid; }
      }
    }
    const col = (PATTERNS[domPid] && PATTERNS[domPid].color) ? hexColor(PATTERNS[domPid].color) : 0xe08030;

    // Slender column — landmark, not clutter
    const geo = new THREE.CylinderGeometry(r * 0.35, r * 0.55, h, 8);
    geo.translate(0, h/2, 0);
    const mat = new THREE.MeshLambertMaterial({ color: col, opacity: 0.9, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(ftTo3(node.x, node.y, 0));
    gNodes.add(mesh);

    // Ring at top
    const ringGeo = new THREE.TorusGeometry(r * 0.8, 2, 6, 16);
    const ringMat = new THREE.MeshBasicMaterial({ color: col });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(ftTo3(node.x, node.y, h));
    ring.rotation.x = Math.PI / 2;
    gNodes.add(ring);
  }
}

// ── SITE FACTS (spine/sponge markers) ─────────────────────────────────────────
function buildSiteFacts3D(derived) {
  // ── Commons Spine: rendered as a tall semi-transparent amber volume ──────
  if (derived.SPINE) {
    const s = derived.SPINE;
    const cx = s.x + s.w/2, cy = s.y + s.h/2;
    const spineH = 9 * 12 * HT_SCALE; // 9 floors — taller than surrounding
    const pos3 = ftTo3(cx, cy, 0);

    // Glowing volume — low opacity, additive feel
    const geo = new THREE.BoxGeometry(s.w, spineH, s.h);
    geo.translate(0, spineH/2, 0);
    const mat = new THREE.MeshLambertMaterial({
      color: 0xc87818, transparent: true, opacity: 0.09, side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos3);
    gGround.add(mesh);

    // Strong vertical edge lines — N-S at east and west face
    const edges = [
      // West face, N and S verticals
      [ftTo3(s.x, s.y, 0), ftTo3(s.x, s.y, spineH)],
      [ftTo3(s.x, s.y+s.h, 0), ftTo3(s.x, s.y+s.h, spineH)],
      // East face
      [ftTo3(s.x+s.w, s.y, 0), ftTo3(s.x+s.w, s.y, spineH)],
      [ftTo3(s.x+s.w, s.y+s.h, 0), ftTo3(s.x+s.w, s.y+s.h, spineH)],
    ];
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xd89030, opacity: 0.55, transparent: true });
    for (const [a,b] of edges) {
      gGround.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]), edgeMat));
    }

    // Top rectangle
    const topMat = new THREE.LineBasicMaterial({ color: 0xd89030, opacity: 0.4, transparent: true });
    const topPts = [
      ftTo3(s.x, s.y, spineH), ftTo3(s.x+s.w, s.y, spineH),
      ftTo3(s.x+s.w, s.y+s.h, spineH), ftTo3(s.x, s.y+s.h, spineH),
      ftTo3(s.x, s.y, spineH)
    ];
    gGround.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(topPts), topMat));

    // Ground footprint fill — amber paving
    const groundGeo = new THREE.PlaneGeometry(s.w, s.h);
    groundGeo.rotateX(-Math.PI/2);
    const groundMat = new THREE.MeshBasicMaterial({ color: 0x6a4a18, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.copy(ftTo3(cx, cy, 0.5));
    gGround.add(groundMesh);
  }

  // ── Sponge Park: elliptical green void ───────────────────────────────────
  if (derived.SPONGE) {
    const sp = derived.SPONGE;
    // Elliptical disc at grade
    const segs = 32;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      pts.push(ftTo3(sp.cx + Math.cos(a)*sp.rx, sp.cy + Math.sin(a)*sp.ry, 1));
    }
    const ringMat = new THREE.LineBasicMaterial({ color: 0x40a860, opacity: 0.5, transparent: true });
    gGround.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ringMat));

    // Filled disc — very dark green
    const discGeo = new THREE.CircleGeometry(1, segs);
    discGeo.scale(sp.rx, sp.ry, 1);
    discGeo.rotateX(-Math.PI/2);
    const discMat = new THREE.MeshBasicMaterial({ color: 0x0e2a18, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
    const disc = new THREE.Mesh(discGeo, discMat);
    disc.position.copy(ftTo3(sp.cx, sp.cy, 0.3));
    gGround.add(disc);

    // Inner basin ring
    if (derived.BASIN) {
      const ba = derived.BASIN;
      const bpts = [];
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        bpts.push(ftTo3(ba.cx + Math.cos(a)*ba.rx, ba.cy + Math.sin(a)*ba.ry, 2));
      }
      const bMat = new THREE.LineBasicMaterial({ color: 0x2890d0, opacity: 0.6, transparent: true });
      gGround.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(bpts), bMat));
    }
  }
}

// ── POSITION CAMERA ───────────────────────────────────────────────────────────
function positionCamera(MAP) {
  const siteW = MAP.x1 - MAP.x0, siteH_ft = MAP.y1 - MAP.y0;
  const camDist = Math.max(siteW, siteH_ft) * 1.4;
  camera.position.set(0, camDist * 0.6, camDist * 0.8);
  camera.near = 1; camera.far = camDist * 5;
  controls.target.set(0, 0, 0);
  controls.minDistance = camDist * 0.05;
  controls.maxDistance = camDist * 3;
  controls.update();
}

// ── TOGGLE BUTTONS ────────────────────────────────────────────────────────────
['buildings','lines','nodes','ground','detail','trees'].forEach(id => {
  const btn = document.getElementById('tog-' + id);
  const grp = { buildings: gBuildings, lines: gLines, nodes: gNodes, ground: gGround, detail: gDetail, trees: gTrees }[id];
  btn.addEventListener('click', () => {
    grp.visible = !grp.visible;
    btn.classList.toggle('on', grp.visible);
  });
});

// ── CONTROLS WIRING ───────────────────────────────────────────────────────────
['passes','eps','res','thresh'].forEach(id => {
  const slider = document.getElementById('ctrl-' + id);
  const val = document.getElementById('val-' + id);
  slider.addEventListener('input', () => {
    if (id === 'res') val.textContent = slider.value;
    else if (id === 'eps') val.textContent = parseFloat(slider.value).toFixed(3);
    else val.textContent = slider.value;
  });
});
document.getElementById('ctrl-htscale').addEventListener('input', e => {
  HT_SCALE = parseFloat(e.target.value);
  document.getElementById('val-htscale').value = HT_SCALE.toFixed(2) + '×';
  document.getElementById('val-htscale').textContent = HT_SCALE.toFixed(2) + '×';
  if (lastResult) render3D(lastResult);
});
document.getElementById('val-htscale').textContent = '2.50×';

// ── RENDER 3D FROM RESULT ─────────────────────────────────────────────────────
function render3D(result) {
  const { fieldLines, hotNodes, buildings, MAP, derived, PATTERNS, proj } = result;
  buildGround(MAP, PARCEL_DATA.parcels, proj);
  buildSiteFacts3D(derived);
  buildBuildings(buildings, derived, PATTERNS, hotNodes);
  buildFieldLines(fieldLines, MAP, PATTERNS);
  buildHotNodes3D(hotNodes, PATTERNS);
  buildGreenery(hotNodes, derived, MAP, fieldLines);
}

// ── SOLVE ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-run').addEventListener('click', async () => {
  const btn = document.getElementById('btn-run');
  const status = document.getElementById('status');
  btn.disabled = true; status.textContent = 'solving…';

  await new Promise(r => setTimeout(r, 20)); // yield to browser

  try {
    const settings = getSettings();
    const parcels = PARCEL_DATA.parcels;
    const { proj, MAP, ftToSvg } = buildProjection(parcels);
    const G = buildParcelGeometry(parcels, proj);
    const { derived } = solveConstraintsMin(G, MAP);

    const t0 = performance.now();
    const solveResult = EC_FieldSolver.solve(parcels, proj, MAP, derived, {
      passes: settings.MAX_PASSES,
      eps: settings.EPS,
      cellSize: settings.CELL_SIZE,
      threshold: settings.THRESHOLD,
      ftToSvg,
    });
    const ms = Math.round(performance.now() - t0);

    // Attach derived, PATTERNS, proj for 3D rendering
    solveResult.derived = derived;
    solveResult.PATTERNS = EC_FieldSolver.PATTERNS;
    solveResult.proj = proj;

    lastResult = solveResult;
    positionCamera(MAP);
    render3D(solveResult);

    const { fieldLines, hotNodes, buildings, saturatedAt } = solveResult;
    status.textContent = `${fieldLines.length} lines · ${hotNodes.length} nodes · ${buildings.length} bldgs · ${ms}ms${saturatedAt ? ' ✓sat' : ''}`;
  } catch(e) {
    window._showErr(e.message || String(e));
    status.textContent = '⚠ error';
  }
  btn.disabled = false;
});

// ── RESIZE ────────────────────────────────────────────────────────────────────
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Position camera at default (before first solve)
camera.position.set(0, 800, 1200);
camera.lookAt(0, 0, 0);

// ── RENDER LOOP ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // LOD: show facade detail only when camera is close enough to read it
  const camDist = camera.position.length();
  gDetail.visible = camDist < 800;
  renderer.render(scene, camera);
}
animate();
</script>
