<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EC Pattern Solver — 3D View</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f08; --surface: #131a0f; --border: #2a3a20; --text: #c8d8b0;
    --accent: #6aaf3d; --dim: #5a7040; --warn: #c8a020;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace;
         height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #ui { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
        padding:8px 12px; border-bottom:1px solid var(--border); background:var(--surface); }
  label { font-size:.75rem; color:var(--dim); }
  input[type=number] { width:52px; background:#0d1509; border:1px solid var(--border);
                       color:var(--text); padding:3px 5px; font-family:inherit; font-size:.8rem;
                       border-radius:3px; }
  button { background:#1a2a10; border:1px solid var(--border); color:var(--accent);
           padding:4px 10px; font-family:inherit; font-size:.8rem; border-radius:3px;
           cursor:pointer; transition:background .15s; }
  button:hover { background:#253d18; }
  button.danger { color:#e05050; border-color:#5a2020; }
  button.danger:hover { background:#3a1a1a; }
  #status { font-size:.72rem; color:var(--dim); margin-left:auto; max-width:420px;
            text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #canvas-wrap { flex:1; position:relative; }
  canvas { width:100%!important; height:100%!important; display:block; }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(11,15,8,0.92);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 10px;
    font-size: .72rem;
    color: var(--text);
    line-height: 1.55;
    max-width: 220px;
    z-index: 999;
    display: none;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div id="ui">
  <label>Lots W<input type="number" id="lotsW" value="8" min="2" max="30"></label>
  <label>Lots H<input type="number" id="lotsH" value="6" min="2" max="20"></label>
  <label>Lot ft<input type="number" id="lotFt" value="50" min="20" max="120"></label>
  <label>Min fl<input type="number" id="minFl" value="2" min="1" max="10"></label>
  <label>Max fl<input type="number" id="maxFl" value="6" min="1" max="20"></label>
  <button id="btnSolve">&#9654; Solve</button>
  <button id="btnClear" class="danger" style="display:none">&#10005; cache</button>
  <span id="status">ready</span>
</div>
<div id="canvas-wrap"><canvas id="c"></canvas></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── constants ────────────────────────────────────────────────────────────────
const CACHE_KEY = 'ec3d_run_v1';
const PATTERN_COLORS = {
  'Courtyard':       0x3d7a4a,
  'Perimeter Block': 0x4a6e3d,
  'Row House':       0x5c8c3a,
  'Tower':           0x2d5c3a,
  'Mixed-Use':       0x8aaf3d,
  'Liner':           0x6aaf3d,
  'Podium':          0x3d6a5c,
};
const DEFAULT_COLOR = 0x4a7040;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const lotsWEl  = document.getElementById('lotsW');
const lotsHEl  = document.getElementById('lotsH');
const lotFtEl  = document.getElementById('lotFt');
const minFlEl  = document.getElementById('minFl');
const maxFlEl  = document.getElementById('maxFl');
const btnSolve = document.getElementById('btnSolve');
const btnClear = document.getElementById('btnClear');
const statusEl = document.getElementById('status');
const canvas   = document.getElementById('c');

// ── Three.js setup ───────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.setPixelRatio(devicePixelRatio);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f08);
scene.fog = new THREE.Fog(0x0b0f08, 80, 220);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
camera.position.set(30, 40, 50);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// lights
const amb = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff8e8, 1.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
scene.add(sun);

// ground
const gGeo = new THREE.PlaneGeometry(300, 300);
const gMat = new THREE.MeshLambertMaterial({ color: 0x0d1509 });
const ground = new THREE.Mesh(gGeo, gMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// resize
function onResize() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// animate
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ── building group ────────────────────────────────────────────────────────────
let buildingGroup = null;

function clearBuildings() {
  if (buildingGroup) { scene.remove(buildingGroup); buildingGroup.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } }); }
  buildingGroup = new THREE.Group();
  scene.add(buildingGroup);
}

// ── solver ───────────────────────────────────────────────────────────────────
function runSolver(params) {
  const { lotsW, lotsH, lotFt, minFl, maxFl } = params;

  // patterns catalogue
  const patterns = [
    { name:'Courtyard',       minLots:4, typology:'courtyard',  flMod:[0,0],  coverage:.65 },
    { name:'Perimeter Block', minLots:2, typology:'perimeter',  flMod:[-1,0], coverage:.70 },
    { name:'Row House',       minLots:1, typology:'rowhouse',   flMod:[-2,0], coverage:.55 },
    { name:'Tower',           minLots:1, typology:'tower',      flMod:[0,2],  coverage:.25 },
    { name:'Mixed-Use',       minLots:2, typology:'mixed',      flMod:[0,1],  coverage:.60 },
    { name:'Liner',           minLots:2, typology:'liner',      flMod:[-1,1], coverage:.40 },
    { name:'Podium',          minLots:2, typology:'podium',     flMod:[0,2],  coverage:.50 },
  ];

  // assign each lot a pattern block
  const blocks = [];
  let x = 0;
  while (x < lotsW) {
    let y = 0;
    while (y < lotsH) {
      // pick a random eligible pattern
      const eligible = patterns.filter(p => p.minLots <= Math.min(lotsW - x, lotsH - y));
      const pat = eligible[Math.floor(Math.random() * eligible.length)];

      // width/height in lots (1–3)
      const bw = Math.min(pat.minLots + Math.floor(Math.random() * 2), lotsW - x);
      const bh = Math.min(pat.minLots + Math.floor(Math.random() * 2), lotsH - y);

      const fl = Math.min(maxFl, Math.max(minFl,
        Math.round((minFl + maxFl) / 2 + pat.flMod[0] + Math.random() * (pat.flMod[1] - pat.flMod[0] + 1))));

      blocks.push({ x, y, bw, bh, pat, fl });
      y += bh;
    }
    x += 1;
  }
  return blocks;
}

// ── render blocks ─────────────────────────────────────────────────────────────
function renderBlocks(blocks, lotFt, minFl) {
  clearBuildings();
  const scale = lotFt / 10; // 1 unit = 10 ft
  const flH   = 1.2;        // floor height in units
  const gap   = 0.15;       // gap between lots

  blocks.forEach(blk => {
    const { x, y, bw, bh, pat, fl } = blk;
    const W  = bw * scale - gap;
    const D  = bh * scale - gap;
    const H  = fl * flH;
    const cx = (x + bw / 2) * scale;
    const cz = (y + bh / 2) * scale;

    const color = PATTERN_COLORS[pat.name] ?? DEFAULT_COLOR;
    const geo = new THREE.BoxGeometry(W, H, D);
    const mat = new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    // wrap in Group for raycasting metadata
    const group = new THREE.Group();
    group.userData.blockInfo = {
      typology: pat.typology,
      patternName: pat.name,
      floors: fl,
      footprintW: Math.round(bw * lotFt),
      footprintD: Math.round(bh * lotFt),
    };
    group.add(mesh);
    group.position.set(cx, H / 2, cz);
    buildingGroup.add(group);
  });
}

// ── tooltip ───────────────────────────────────────────────────────────────────
const tooltipEl = document.getElementById('tooltip');
const raycaster  = new THREE.Raycaster();
const mouse      = new THREE.Vector2();

function _showTooltip(cx, cy, blk, patName) {
  tooltipEl.textContent =
    `${blk.typology.charAt(0).toUpperCase() + blk.typology.slice(1)} • ${patName}\n` +
    `Floors: ${blk.floors}\n` +
    `Footprint: ${blk.footprintW}×${blk.footprintD} ft`;
  tooltipEl.style.display = 'block';
  _moveTooltip(cx, cy);
}
function _moveTooltip(cx, cy) {
  const tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
  let lx = cx + 14, ly = cy - 10;
  if (lx + tw > window.innerWidth  - 8) lx = cx - tw - 10;
  if (ly + th > window.innerHeight - 8) ly = cy - th - 4;
  tooltipEl.style.left = lx + 'px';
  tooltipEl.style.top  = ly + 'px';
}
function _hideTooltip() {
  tooltipEl.style.display = 'none';
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x =  (e.clientX - rect.left)  / rect.width  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(buildingGroup ? buildingGroup.children : [], true);

  if (hits.length) {
    // walk up to the Group that has userData.blockInfo
    let obj = hits[0].object;
    while (obj && !obj.userData.blockInfo) obj = obj.parent;
    if (obj?.userData?.blockInfo) {
      const blk = obj.userData.blockInfo;
      const patName = blk.patternName;
      _showTooltip(e.clientX, e.clientY, blk, patName);
      return;
    }
  }
  _hideTooltip();
});

canvas.addEventListener('mousemove', e => { // move existing tooltip
  if (tooltipEl.style.display === 'block') _moveTooltip(e.clientX, e.clientY);
});

// ── localStorage persistence ──────────────────────────────────────────────────
function saveRun(params, blocks) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), params, blocks }));
  } catch(e) { /* quota exceeded — ignore */ }
}

function loadRun() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function clearRun() {
  localStorage.removeItem(CACHE_KEY);
}

function ageStr(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60)   return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

// ── solve button ──────────────────────────────────────────────────────────────
btnSolve.addEventListener('click', () => {
  const params = {
    lotsW: +lotsWEl.value, lotsH: +lotsHEl.value,
    lotFt: +lotFtEl.value, minFl: +minFlEl.value, maxFl: +maxFlEl.value,
  };
  const blocks = runSolver(params);
  renderBlocks(blocks, params.lotFt, params.minFl);
  saveRun(params, blocks);
  btnClear.style.display = 'inline-block';
  statusEl.textContent = `${blocks.length} blocks — saved to cache`;
});

// ── clear cache button ────────────────────────────────────────────────────────
btnClear.addEventListener('click', () => {
  clearRun();
  clearBuildings();
  btnClear.style.display = 'none';
  statusEl.textContent = 'cache cleared';
});

// ── restore on load ───────────────────────────────────────────────────────────
(function restoreFromCache() {
  const run = loadRun();
  if (!run) { statusEl.textContent = 'ready'; return; }
  const { ts, params, blocks } = run;
  // restore UI inputs
  lotsWEl.value = params.lotsW;
  lotsHEl.value = params.lotsH;
  lotFtEl.value = params.lotFt;
  minFlEl.value = params.minFl;
  maxFlEl.value = params.maxFl;
  renderBlocks(blocks, params.lotFt, params.minFl);
  btnClear.style.display = 'inline-block';
  statusEl.textContent = `restored from cache (${ageStr(ts)})`;
})();

canvas.addEventListener('mouseleave', _hideTooltip);
</script>
<div id="tooltip"></div>
</body>
</html>
