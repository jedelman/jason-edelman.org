<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor · Broadsheet</title>
  <meta name="description" content="Make a front page from the standard.site writers you follow, and publish it as a standard.site document.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&family=Epilogue:wght@400;600;900&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="../paper.css">
  <style>
    :root {
      --bg:      oklch(11% 0.006 145);
      --surface: oklch(16% 0.007 145);
      --border:  oklch(25% 0.008 145);
      --rule:    oklch(19% 0.007 145);
      --text:    oklch(88% 0.010 145);
      --muted:   oklch(62% 0.010 145);
      --accent:  oklch(70% 0.12 145);
      --warn:    oklch(78% 0.11 75);
      --bad:     oklch(72% 0.15 25);
      --sans:    'Epilogue', system-ui, sans-serif;
      --typed:   'Courier Prime', 'Courier New', monospace;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    a { color: var(--accent); }
    button, input, textarea, select { font: inherit; color: var(--text); }
    input, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 0; padding: 0 10px; min-height: 40px; width: 100%; min-width: 0; }
    textarea { padding: 8px 10px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { background: none; border: 1px solid var(--border); min-height: 36px; padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: 0.02em; white-space: nowrap; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.quiet { border-color: transparent; color: var(--muted); }
    button.quiet:hover { color: var(--text); }
    button:disabled { opacity: 0.45; cursor: default; }
    .meta { color: var(--muted); font-size: 12.5px; }
    .status { font-size: 13px; min-height: 1.3em; }
    .status[data-tone=bad] { color: var(--bad); }
    .status[data-tone=ok] { color: var(--accent); }

    /* ── Top bar ───────────────────────────────────────────────────── */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; background: var(--bg); }
    .brand { font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; color: var(--text); text-decoration: none; }
    .brand span { color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: none; margin-left: 8px; }
    #account { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #account form { display: flex; gap: 6px; }
    #account input { width: 210px; min-height: 34px; }
    .views { display: none; gap: 4px; }
    .views button[aria-pressed=true] { border-color: var(--accent); color: var(--text); }

    /* ── Desk ──────────────────────────────────────────────────────── */
    .desk { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: calc(100vh - 57px); }
    .page-pane { padding: 16px; min-width: 0; }
    .wire-pane { border-left: 1px solid var(--border); background: oklch(13% 0.006 145); position: sticky; top: 57px; height: calc(100vh - 57px); display: flex; flex-direction: column; min-width: 0; }

    .controls { max-width: 1240px; margin: 0 auto 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px 14px; align-items: start; }
    .controls label { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .controls .masthead input { font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 1.15rem; }
    .controls .editor-note textarea { min-height: 40px; height: 40px; font-family: 'Newsreader', Georgia, serif; font-style: italic; }
    .controls .row { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .controls .row .grow { flex: 1; }
    .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
    .check input { width: auto; min-height: 0; accent-color: oklch(70% 0.12 145); }
    .check select { background: var(--surface); border: 1px solid var(--border); border-radius: 0; min-height: 36px; padding: 0 8px; color: var(--text); font-size: 13px; }
    .mine { max-width: 1240px; margin: 0 auto 14px; font-size: 13px; }
    .mine summary { cursor: pointer; color: var(--muted); }
    .mine ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .mine li { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
    .mine li button { min-height: 0; padding: 0; border: none; color: var(--accent); font-weight: 400; }

    /* ── Slots on the paper ────────────────────────────────────────── */
    .paper.editing { --slot-line: oklch(70% 0.02 85); }
    .slot { position: relative; min-width: 0; outline: 1px dashed transparent; outline-offset: 6px; transition: outline-color 120ms, background 120ms; }
    .slot:hover, .slot:focus-within { outline-color: var(--slot-line); }
    .slot.over { outline: 2px solid var(--spot); background: color-mix(in oklch, var(--spot) 6%, transparent); }
    .slot-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); flex-wrap: wrap; }
    .slot-bar .label { font-weight: 600; margin-right: auto; cursor: grab; }
    .slot-bar button, .slot-bar select { font-family: var(--sans); font-size: 11px; color: var(--ink-2); background: transparent; border: 1px solid var(--hair); min-height: 24px; padding: 0 7px; letter-spacing: 0.02em; text-transform: none; font-weight: 600; border-radius: 0; }
    .slot-bar button:hover { color: var(--ink); border-color: var(--ink-2); }
    .slot-empty { border: 1px dashed var(--slot-line); color: var(--ink-3); font-family: var(--sans); font-size: 12.5px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 18px 12px; min-height: 90px; }
    .slot.role-lead .slot-empty { min-height: 300px; font-size: 14px; }
    .slot.role-second .slot-empty, .slot.role-feature .slot-empty { min-height: 160px; }
    .slot-edit { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding: 10px; background: color-mix(in oklch, var(--ink) 5%, var(--paper)); border: 1px solid var(--hair); }
    .slot-edit input, .slot-edit textarea { background: var(--paper); color: var(--ink); border: 1px solid var(--hair); font-family: var(--serif); min-height: 34px; }
    .slot-edit .hint { font-family: var(--sans); font-size: 11px; color: var(--ink-3); }
    .slot-edit .actions { display: flex; gap: 6px; }
    .slot-edit button { color: var(--ink); border-color: var(--hair); min-height: 28px; font-family: var(--sans); }
    .slot .changed { font-family: var(--sans); font-size: 11px; color: var(--spot); margin-top: 6px; }

    /* ── The wire ──────────────────────────────────────────────────── */
    .wire-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .wire-head h2 { margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { min-height: 26px; padding: 0 8px; font-family: var(--typed); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
    .chip[aria-pressed=true] { border-color: var(--accent); color: var(--text); background: color-mix(in oklch, var(--accent) 14%, transparent); }
    .chip .n { color: var(--muted); margin-left: 4px; }
    .wire { list-style: none; margin: 0; padding: 6px 0 24px; overflow-y: auto; flex: 1; }
    .card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule); cursor: grab; }
    .card:hover { background: oklch(16% 0.007 145); }
    .card.used { opacity: 0.5; }
    .card.dragging { opacity: 0.35; }
    .card-meta { grid-column: 1; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); min-width: 0; }
    .card-meta img { width: 14px; height: 14px; border-radius: 2px; object-fit: cover; flex: none; }
    .card-meta .pub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
    .card h3 { grid-column: 1; margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere; }
    .card p { grid-column: 1; margin: 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .thumb { grid-column: 2; grid-row: 1 / span 3; width: 72px; height: 72px; object-fit: cover; background: var(--surface); }
    .card-actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .card-actions button { min-height: 26px; padding: 0 9px; font-size: 12px; }
    .card-actions a { font-size: 12px; }
    .badge { font-family: var(--typed); font-size: 11px; color: var(--warn); }
    .badge.sub { color: var(--accent); }
    .wire-empty { padding: 20px 14px; color: var(--muted); font-size: 13px; }
    .combo { position: relative; display: inline-flex; min-width: 0; }
    .combo > input { width: 100%; }
    .add-writer .combo { flex: 1; }
    .typeahead { position: absolute; top: calc(100% + 2px); right: 0; z-index: 40; min-width: 100%; width: max-content; max-width: min(22rem, 92vw); list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 14px 32px -14px oklch(0% 0 0 / 0.7); }
    .typeahead li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 44px; min-width: 0; cursor: pointer; }
    .typeahead li[aria-selected=true], .typeahead li:hover { background: var(--border); }
    .typeahead img, .typeahead .avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; object-fit: cover; background: var(--bg); }
    .typeahead .ta-who { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
    .typeahead .ta-who strong { font-weight: 600; font-size: 13.5px; }
    .typeahead .ta-who .ta-h { font-size: 12px; color: var(--muted); }
    .add-writer { display: flex; gap: 6px; }
    .add-writer input { min-height: 32px; font-size: 13px; }
    .add-writer button { min-height: 32px; }
    .wire-status { padding: 8px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--rule); }

    @media (max-width: 980px) {
      .desk { grid-template-columns: minmax(0, 1fr); }
      .wire-pane { position: static; height: auto; border-left: none; }
      .wire { overflow: visible; }
      .views { display: flex; }
      body[data-view=page] .wire-pane, body[data-view=wire] .page-pane { display: none; }
      .controls { grid-template-columns: minmax(0, 1fr); }
      #account input { width: 160px; }
    }
  </style>
</head>
<body data-view="page">
  <header class="top">
    <a class="brand" href="../newsstand/">Broadsheet<span>Editor</span></a>
    <div class="views" role="group" aria-label="View">
      <button type="button" data-view="page" aria-pressed="true">Page</button>
      <button type="button" data-view="wire" aria-pressed="false">Wire <span id="wire-count"></span></button>
    </div>
    <div id="account"></div>
  </header>
  <div class="desk">
    <section class="page-pane" aria-label="The page">
      <div class="controls">
        <div class="masthead"><label for="masthead">Masthead</label><input id="masthead" maxlength="200" placeholder="Name your broadsheet"></div>
        <div class="editor-note"><label for="note">From the editor</label><textarea id="note" maxlength="3000" rows="1" placeholder="Optional: a line on this edition"></textarea></div>
        <div class="row">
          <button type="button" id="autofill">Auto-fill</button>
          <button type="button" id="clear" class="quiet">Clear the page</button>
          <span class="grow"></span>
          <label class="check"><input type="checkbox" id="recommend" checked> Recommend each pick</label>
          <label class="check edition">Edition
            <select id="period" aria-label="Which edition">
              <option value="">Today’s</option>
              <option value="am">Morning</option>
              <option value="pm">Evening</option>
            </select>
          </label>
          <button type="button" class="primary" id="publish">Publish</button>
        </div>
        <p class="status row" id="status" role="status"></p>
      </div>
      <details class="mine" id="mine" hidden><summary>Your editions (published editions are frozen)</summary><ul id="mine-list"></ul></details>
      <div class="paper-frame"><article class="paper editing" id="paper"></article></div>
    </section>
    <aside class="wire-pane" aria-label="The wire">
      <div class="wire-head">
        <h2><span>The wire</span><span id="wire-who"></span></h2>
        <input id="q" type="search" placeholder="Search titles, writers, tags, text" aria-label="Search the wire">
        <form class="add-writer" id="add-writer"><input id="writer" placeholder="Add a writer by handle" autocapitalize="none" spellcheck="false" aria-label="Add a writer by handle"><button type="submit">Add</button></form>
        <div class="chips" id="sources" role="group" aria-label="Source"></div>
        <div class="chips" id="windows" role="group" aria-label="Published within"></div>
      </div>
      <p class="wire-status" id="wire-status" aria-live="polite">Reading the wire…</p>
      <ul class="wire" id="wire"></ul>
    </aside>
  </div>
  <script type="module" src="editor.js"></script>
</body>
</html>
