# public/ is the assets root — built by npm run build, not committed to git
[assets]
directory = "public"
not_found_handling = "single-page-application"

# Custom domains — declared here so wrangler deploy doesn't wipe the dashboard binding
[[routes]]
pattern = "jason-edelman.org"
custom_domain = true

[[routes]]
pattern = "www.jason-edelman.org"
custom_domain = true
