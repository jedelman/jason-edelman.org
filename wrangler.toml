name = "jason-edelman-org"
compatibility_date = "2026-04-28"
account_id = "543fde7feabd0af945bfae926ceea7ad"

# A small Worker answers byte ranges for /video/* (Safari won't play video without them; static assets send whole
# files). Everything else is served as static assets and never runs it.
main = "worker.js"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/video/*"]
